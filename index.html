<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys Indexer - Recuperación Binaria</title>
    <style>
        body { font-family: 'Consolas', monospace; background: #0d0d0d; color: #00ff00; margin: 20px; }
        .container { max-width: 900px; margin: auto; background: #1a1a1a; padding: 20px; border: 1px solid #00ff00; border-radius: 5px; }
        .upload-area { border: 2px dashed #00ff00; padding: 40px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        #log { background: #000; padding: 15px; height: 300px; overflow-y: auto; border: 1px solid #333; font-size: 12px; white-space: pre-wrap; }
        .btn { background: #00ff00; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn:disabled { background: #004400; color: #008800; }
    </style>
</head>
<body>

<div class="container">
    <h2>AMNERYS BINARY DECODER</h2>
    <p style="color: #888;">Estructura: Little-Endian | Headers: Long | Coords: Integer</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        SOLTAR GRAFICOS.IND AQUÍ O HACER CLIC
        <input type="file" id="fileInput" hidden accept=".ind">
    </div>

    <div id="log">Esperando archivo binario...</div>
    <div id="downloadArea"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const log = document.getElementById('log');

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        log.innerHTML = `> Analizando: ${file.name}\n`;
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 0;

        try {
            // CABECERA (8 bytes iniciales)
            const version = view.getInt32(offset, true); offset += 4;
            const grhCount = view.getInt32(offset, true); offset += 4;

            log.innerHTML += `> Versión: ${version} | Registros: ${grhCount}\n`;

            let iniRows = [];
            iniRows.push("[INIT]");
            iniRows.push(`NumGrh=${grhCount}`);
            iniRows.push(`Version=${version}\n`);
            iniRows.push("[Graphics]");

            let count = 0;

            // PROCESAMIENTO DE REGISTROS
            // Usamos un bucle basado en la longitud del archivo para evitar desbordamientos
            while (offset + 4 <= buffer.byteLength) {
                const grhIndex = view.getInt32(offset, true); offset += 4;
                
                if (grhIndex <= 0) break;

                const numFrames = view.getInt16(offset, true); offset += 2;

                if (numFrames === 1) {
                    // Gráfico Simple (14 bytes adicionales)
                    const fileNum = view.getInt32(offset, true); offset += 4;
                    const sX = view.getInt16(offset, true); offset += 2;
                    const sY = view.getInt16(offset, true); offset += 2;
                    const width = view.getInt16(offset, true); offset += 2;
                    const height = view.getInt16(offset, true); offset += 2;

                    iniRows.push(`Grh${grhIndex}=1-${fileNum}-${sX}-${sY}-${width}-${height}`);
                } else {
                    // Animación
                    let frames = [];
                    for(let i = 0; i < numFrames; i++) {
                        frames.push(view.getInt32(offset, true));
                        offset += 4;
                    }
                    // Velocidad (Single - 4 bytes)
                    const speed = view.getFloat32(offset, true).toFixed(3).replace(/\.?0+$/, "");
                    offset += 4;
                    iniRows.push(`Grh${grhIndex}=${numFrames}-${frames.join('-')}-${speed}`);
                }

                count++;
                if (count % 2000 === 0) log.innerHTML += `> Procesando... (${count})\n`;
            }

            log.innerHTML += `> ¡Éxito! ${count} registros decodificados.\n`;
            
            // Crear descarga
            const blob = new Blob([iniRows.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            document.getElementById('downloadArea').innerHTML = `
                <button class="btn" onclick="window.location.href='${url}'" download="Graficos.ini">
                    DESCARGAR RECONSTRUIDO .INI
                </button>`;

        } catch (err) {
            log.innerHTML += `\n!!! ERROR DE DESFASE: El archivo binario no sigue el patrón esperado.\n`;
            log.innerHTML += `Detalle: ${err.message}\n`;
            log.innerHTML += `Último Offset: ${offset}\n`;
        }
    };
</script>
</body>
</html>
