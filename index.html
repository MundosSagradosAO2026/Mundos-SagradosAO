<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recursos Amnerys AO</title>

<style>
body{
    margin:0;
    font-family: Consolas, monospace;
    background:#0b0b0b;
    color:#00ff9c;
}

/* VISTAS */
.view{ display:none; height:100vh; flex-direction:column; }
.active{ display:flex; }

/* HEADER */
.header{
    background:#111;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    border-bottom:1px solid #222;
}

/* TITULO */
.title{
    font-size:22px;
    font-weight:bold;
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc;
}

/* BOTONES */
button{
    background:#1e1e1e;
    border:1px solid #333;
    color:#00ff9c;
    padding:8px 15px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#00adb5;
    color:#000;
}

/* CONTENIDO */
.panel{
    flex:1;
    padding:10px;
    overflow:auto;
    background:#000;
    border-top:1px solid #111;
    white-space:pre;
    font-size:13px;
}

/* TEXTAREA */
textarea{
    flex:1;
    background:#000;
    color:#00ff9c;
    border:none;
    padding:10px;
    outline:none;
    resize:none;
}

/* MENU */
.menu{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:20px;
}

.menu h1{
    font-size:40px;
    color:#00ffcc;
    text-shadow:0 0 20px #00ffcc;
}

.menu button{
    width:250px;
    font-size:16px;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="main" class="view active menu">
    <h1>RECURSOS AMNERYS AO</h1>
    <button onclick="show('map')">📂 Analizador MAP / INF / DAT</button>
    <button onclick="show('ind')">🖼️ Editor IND</button>
</div>

<!-- MAP -->
<div id="map" class="view">
    <div class="header">
        <button onclick="show('main')">←</button>
        <div class="title">Analizador de Mapas</div>

        <input type="file" id="mapInput" hidden>
        <input type="file" id="infInput" hidden>
        <input type="file" id="datInput" hidden>

        <button onclick="mapInput.click()">MAP</button>
        <button onclick="infInput.click()">INF</button>
        <button onclick="datInput.click()">DAT</button>
    </div>

    <div id="mapDebug" class="panel"></div>
</div>

<!-- IND -->
<div id="ind" class="view">
    <div class="header">
        <button onclick="show('main')">←</button>
        <div class="title">Editor Graficos.ind</div>

        <input type="file" id="loadInd" hidden>

        <button onclick="loadInd.click()">Cargar IND</button>
        <button onclick="saveIni()">Exportar INI</button>
    </div>

    <textarea id="editor"></textarea>
</div>

<script>
function show(v){
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    document.getElementById(v).classList.add('active');
}

//////////////////////////////////////////////////
// MAP
//////////////////////////////////////////////////
mapInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);

    let out = "=== MAPA ===\n\n";

    let offset = 272;
    let count = 0;

    for(let y=0;y<100;y++){
        for(let x=0;x<100;x++){

            if(offset+3>buf.byteLength) break;

            let block = view.getUint8(offset);
            let grh = view.getUint16(offset+1,true);

            if(count<500)
                out += `[${x},${y}]  Block:${block}  GRH:${grh}\n`;

            offset+=3;
            count++;
        }
    }

    out += "\nTotal tiles: "+count;
    mapDebug.innerText = out;
};

//////////////////////////////////////////////////
// INF
//////////////////////////////////////////////////
infInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);

    let out = "=== INF (EVENTOS) ===\n\n";

    let offset = 0;
    let count = 0;

    while(offset < buf.byteLength-6){

        if(view.getUint8(offset)==1 && view.getUint8(offset+1)==2){

            const tipo = view.getUint8(offset+3);
            const id   = view.getUint8(offset+5);

            let data = [];
            let hasData = false;

            for(let i=0;i<16;i++){
                if(offset+6+i>=buf.byteLength) break;
                let b = view.getUint8(offset+6+i);
                if(b!==0) hasData = true;
                data.push(b.toString(16).padStart(2,'0'));
            }

            if(hasData){
                out += `EVENTO #${count}\n`;
                out += `Tipo: ${tipo} | TileID: ${id}\n`;
                out += `Data: ${data.join(" ")}\n\n`;
            }

            count++;
            offset+=6;
        }else{
            offset++;
        }
    }

    out += `TOTAL BLOQUES: ${count}`;
    mapDebug.innerText = out;
};

//////////////////////////////////////////////////
// DAT
//////////////////////////////////////////////////
datInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();

    let text = new TextDecoder("latin1").decode(buf);

    let out = "=== CONFIG MAPA (.DAT) ===\n\n";

    text.split(/\r?\n/).forEach(l=>{
        if(l.trim() !== "") out += l + "\n";
    });

    mapDebug.innerText = out;
};

//////////////////////////////////////////////////
// IND (NO TOCADO)
//////////////////////////////////////////////////
loadInd.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let offset=0;
    const ver=view.getInt32(offset,true); offset+=4;
    const total=view.getInt32(offset,true); offset+=4;

    let text=`[INIT]\nNumGrh=${total}\nVersion=${ver}\n\n[Graphics]\n`;

    while(offset<buffer.byteLength){
        const index=view.getInt32(offset,true); offset+=4;
        if(index<=0) break;

        const frames=view.getInt16(offset,true); offset+=2;

        if(frames===1){
            const f=view.getInt32(offset,true); offset+=4;
            const x=view.getInt16(offset,true); offset+=2;
            const y=view.getInt16(offset,true); offset+=2;
            const w=view.getInt16(offset,true); offset+=2;
            const h=view.getInt16(offset,true); offset+=2;

            text+=`Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
        }else{
            let ids=[];
            for(let i=0;i<frames;i++){
                ids.push(view.getInt32(offset,true));
                offset+=4;
            }
            const spd=view.getFloat32(offset,true); offset+=4;
            text+=`Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
        }
    }

    editor.value=text;
};

function saveIni(){
    const blob=new Blob([editor.value],{type:"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Graficos.ini";
    a.click();
}
</script>

</body>
</html>
