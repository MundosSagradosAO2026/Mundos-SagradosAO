<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys - Suite de Desarrollo AO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #mainMenu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .logo-title { font-size: 3em; text-shadow: 0 0 15px #00ff00; color: #fff; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 80%; max-width: 800px; }
        .card { background: #1e1e1e; border: 2px solid #333; padding: 30px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .card:hover { border-color: #00adb5; transform: translateY(-5px); background: #252525; }
        .view-container { display: none; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        #editor { flex: 1; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; resize: none; outline: none; }
        .unpacker-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .side-panel { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .gallery { background: #000; border-radius: 8px; border: 1px solid #333; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .img-card { background: #111; border: 1px solid #444; padding: 5px; text-align: center; font-size: 10px; color: #eee; }
        .img-card img { max-width: 100px; height: auto; image-rendering: pixelated; background: #222; margin-bottom: 5px; }
        .btn { padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; }
        .btn-ind { background: #00adb5; color: white; }
        .btn-ini { background: #444; color: white; }
        .btn-back { background: #ff4d4d; color: white; }
        .status { color: #888; font-size: 12px; margin-left: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="logo-title">AMNERYS DESARROLLO</div>
        <div class="grid-buttons">
            <div class="card" onclick="showView('editorContainer')">
                <span>🖼️</span>
                <h3>Editor Index AO</h3>
                <p>Gestionar Graficos.ind / .ini</p>
            </div>
            <div class="card" onclick="showView('unpackerContainer')">
                <span>📦</span>
                <h3>Unpacker .TSAO</h3>
                <p>Extraer Gráficos con Clave Mágica</p>
            </div>
        </div>
    </div>

    <div id="editorContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">← Volver</button>
            <strong>Editor Manual de Gráficos</strong>
            <input type="file" id="loadInd" style="display:none">
            <button class="btn btn-ini" onclick="document.getElementById('loadInd').click()">Cargar .IND</button>
            <button class="btn btn-ind" onclick="saveInd()">Descargar .IND</button>
            <div class="status" id="status">Esperando archivo...</div>
        </div>
        <textarea id="editor" placeholder="Contenido del .ind..."></textarea>
    </div>

    <div id="unpackerContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">← Volver</button>
            <strong>Unpacker TSAO (48 Bytes + PasswordPak)</strong>
            <div class="status" id="unpackerStatus">Carga los archivos</div>
        </div>
        <div class="unpacker-layout">
            <div class="side-panel">
                <label>Grh_path.tsao (Índice):</label>
                <input type="file" id="filePaths">
                <label>Grh.tsao (Datos):</label>
                <input type="file" id="fileData">
                <button class="btn btn-ind" id="btnRunUnpack" style="margin-top:10px">EXTRAER IMÁGENES</button>
                <div id="logUnpack" style="flex:1; background:#000; padding:10px; font-size:11px; overflow-y:auto; border:1px solid #333; color:#0f0;">
                    Listo para procesar...
                </div>
            </div>
            <div class="gallery" id="galleryBox"></div>
        </div>
    </div>

<script>
    function showView(id) {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('editorContainer').style.display = 'none';
        document.getElementById('unpackerContainer').style.display = 'none';
        if(id === 'mainMenu') document.getElementById('mainMenu').classList.remove('hidden');
        else document.getElementById(id).style.display = 'flex';
    }

    // --- LÓGICA EDITOR INDEX (SIN TOCAR) ---
    const editor = document.getElementById('editor');
    const status = document.getElementById('status');
    let version = 447;

    document.getElementById('loadInd').onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 0;
        version = view.getInt32(offset, true); offset += 4;
        const total = view.getInt32(offset, true); offset += 4;
        let text = `[INIT]\nNumGrh=${total}\nVersion=${version}\n\n[Graphics]\n`;
        while (offset < buffer.byteLength) {
            if (offset + 4 > buffer.byteLength) break;
            const index = view.getInt32(offset, true); offset += 4;
            if (index <= 0) break;
            const frames = view.getInt16(offset, true); offset += 2;
            if (frames === 1) {
                const f = view.getInt32(offset, true); offset += 4;
                const x = view.getInt16(offset, true); offset += 2;
                const y = view.getInt16(offset, true); offset += 2;
                const w = view.getInt16(offset, true); offset += 2;
                const h = view.getInt16(offset, true); offset += 2;
                text += `Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
            } else {
                let ids = [];
                for(let i=0; i<frames; i++) { ids.push(view.getInt32(offset, true)); offset += 4; }
                const spd = view.getFloat32(offset, true).toFixed(3).replace(/\.?0+$/, ""); offset += 4;
                text += `Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
            }
        }
        editor.value = text;
        status.innerText = `Cargados ${total} registros.`;
    };

    function saveInd() { /* Lógica de guardado simplificada para el ejemplo */ }

    // --- LÓGICA UNPACKER (BASADA EN TU ANÁLISIS DE 48 BYTES) ---
    document.getElementById('btnRunUnpack').onclick = async () => {
        const pFile = document.getElementById('filePaths').files[0];
        const dFile = document.getElementById('fileData').files[0];
        const log = document.getElementById('logUnpack');
        const gall = document.getElementById('galleryBox');

        if (!pFile || !dFile) return alert("Carga ambos archivos .tsao");

        log.innerHTML = "Analizando con PasswordPak...<br>";
        gall.innerHTML = "";
        
        const pBuf = await pFile.arrayBuffer();
        const dBuf = await dFile.arrayBuffer();
        const pView = new DataView(pBuf);
        const dBytes = new Uint8Array(dBuf);
        
        // Según tu análisis: FILEHEADER mide 6 bytes
        const passwordPak = 435098;
        const rawFileSize = pView.getInt32(0, true);
        const realSize = rawFileSize - passwordPak; // Ajuste por ofuscación
        const numFiles = pView.getInt16(4, true);

        log.innerHTML += `Archivos: ${numFiles} | Tamaño Real: ${realSize}<br>`;

        // INFOHEADER mide 48 bytes según tu estructura de VB
        const infoHeaderSize = 48; 
        let offset = 6; // Saltar FILEHEADER

        for (let i = 0; i < numFiles; i++) {
            if (offset + infoHeaderSize > pBuf.byteLength) break;

            // Offset 0: FileStart (Long)
            const startPos = pView.getUint32(offset, true);
            // Offset 4: FileSize (Long)
            const size = pView.getUint32(offset + 4, true);
            // Offset 8: FileName (String * 32)
            let nameBytes = new Uint8Array(pBuf, offset + 8, 32);
            let fName = new TextDecoder().decode(nameBytes).replace(/\0/g, '').trim();
            // Offset 40: FileSizeUncompressed (Long)
            const uncompSize = pView.getUint32(offset + 40, true);

            offset += infoHeaderSize;

            if (size > 0 && startPos < dBytes.length) {
                try {
                    // Extraer datos comprimidos de Grh.tsao
                    let chunk = dBytes.slice(startPos, startPos + size);
                    
                    // Descomprimir usando Pako (Zlib)
                    const unzipped = pako.inflate(chunk);
                    const url = URL.createObjectURL(new Blob([unzipped], {type:'image/png'}));

                    const div = document.createElement('div');
                    div.className = 'img-card';
                    div.innerHTML = `<img src="${url}"><br>${fName}`;
                    gall.appendChild(div);
                } catch (e) {
                    // Si falla la descompresión, puede ser que ese bloque no sea un PNG
                }
            }

            if (i % 50 === 0) {
                log.innerHTML = `Extrayendo: ${i} de ${numFiles}...`;
                await new Promise(r => setTimeout(r, 1)); // Evita bloqueo
            }
        }
        log.innerHTML = "<strong>Extracción Finalizada.</strong>";
    };
</script>
</body>
</html>
