<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor Graficos.ind PRO</title>

<style>
body{
    background:#0b0b0b;
    color:#FFD700;
    font-family: monospace;
    text-align:center;
    padding:40px;
}
.box{
    border:1px solid #FFD700;
    padding:20px;
    max-width:900px;
    margin:auto;
    background:#111;
}
button{
    background:#FFD700;
    border:none;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
    font-weight:bold;
}
pre{
    text-align:left;
    background:#000;
    padding:10px;
    height:300px;
    overflow:auto;
    color:#0f0;
}
textarea{
    width:100%;
    height:200px;
    background:#000;
    color:#0f0;
    margin-top:10px;
}
.progress{
    width:100%;
    background:#222;
    height:20px;
    margin-top:15px;
    border:1px solid #FFD700;
}
.bar{
    height:100%;
    width:0%;
    background:#FFD700;
}
</style>
</head>

<body>

<div class="box">
<h2>📦 Editor Graficos.ind PRO (FIX REAL)</h2>

<input type="file" id="fileInput"><br>

<button onclick="leerIND()">Leer .IND</button>
<button onclick="descargarINI()">Descargar .INI</button>
<button onclick="generarIND()">Generar .IND</button>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="info"></p>
<pre id="output"></pre>

<h3>Editor INI</h3>
<textarea id="iniEditor"></textarea>

</div>

<script>

let iniTexto = "";

/* =========================
   LECTURA
========================= */

function leerIND(){

    const file = document.getElementById("fileInput").files[0];
    if(!file) return alert("Subí un .ind");

    const reader = new FileReader();

    reader.onload = function(e){

        try{

            const view = new DataView(e.target.result);

            let offset = 0;
            const total = view.byteLength;

            function canRead(n){
                return offset + n <= total;
            }

            function readLong(){
                if(!canRead(4)) return null;
                let v = view.getInt32(offset, true);
                offset += 4;
                return v;
            }

            function readShort(){
                if(!canRead(2)) return null;
                let v = view.getInt16(offset, true);
                offset += 2;
                return v;
            }

            function readFloat(){
                if(!canRead(4)) return null;
                let v = view.getFloat32(offset, true);
                offset += 4;
                return v;
            }

            function skip(n){
                offset += n;
            }

            let version = readLong();
            let grhCount = readLong();

            let ini = "[INIT]\n";
            ini += "NumGrh=" + grhCount + "\n";
            ini += "Version=" + version + "\n\n";
            ini += "[Graphics]\n";

            let leidos = 0;

            while(true){

                let grhIndex = readLong();
                if(grhIndex === null || grhIndex === 0) break;

                let numFrames = readShort();
                if(numFrames === null) break;

                skip(2); // 🔥 padding real del archivo

                if(numFrames <= 0 || numFrames > 2000){
                    console.warn("Frames inválidos:", numFrames);
                    break;
                }

                if(numFrames === 1){

                    if(!canRead(20)) break;

                    let fileNum = readLong();
                    let sX = readLong();
                    let sY = readLong();
                    let w = readLong();
                    let h = readLong();

                    ini += `Grh${grhIndex}=1-${fileNum}-${sX}-${sY}-${w}-${h}\n`;

                }else{

                    if(!canRead(numFrames * 4 + 4)) break;

                    let frames = [];

                    for(let i=0;i<numFrames;i++){
                        frames.push(readLong());
                    }

                    let speed = readFloat();

                    ini += `Grh${grhIndex}=${numFrames}-${frames.join("-")}-${speed.toFixed(2)}\n`;
                }

                leidos++;

                if(leidos % 200 === 0){
                    let p = (offset / total) * 100;
                    document.getElementById("bar").style.width = p + "%";
                }
            }

            iniTexto = ini;
            document.getElementById("iniEditor").value = ini;

            document.getElementById("bar").style.width = "100%";

            document.getElementById("info").innerText =
                `✔ Version: ${version} | Declarados: ${grhCount} | Leídos: ${leidos}`;

            document.getElementById("output").innerText =
                ini.substring(0, 3000);

        }catch(err){
            document.getElementById("output").innerText =
                "ERROR: " + err;
        }
    };

    reader.readAsArrayBuffer(file);
}

/* =========================
   DESCARGAR INI
========================= */

function descargarINI(){

    let txt = document.getElementById("iniEditor").value;
    if(!txt) return alert("No hay INI");

    let blob = new Blob([txt], {type:"text/plain"});
    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "Graficos.ini";
    a.click();
}

/* =========================
   GENERAR IND (COMPATIBLE)
========================= */

function generarIND(){

    let txt = document.getElementById("iniEditor").value;
    if(!txt) return alert("Pegá un INI");

    let lines = txt.split("\n");

    let version = 0;
    let numGrh = 0;
    let graficos = [];

    for(let l of lines){

        l = l.trim();

        if(l.startsWith("Version=")){
            version = parseInt(l.split("=")[1]);
        }

        if(l.startsWith("NumGrh=")){
            numGrh = parseInt(l.split("=")[1]);
        }

        if(l.startsWith("Grh")){

            let [id, data] = l.split("=");

            let index = parseInt(id.replace("Grh",""));
            let parts = data.split("-").map(Number);

            let numFrames = parts[0];

            if(numFrames === 1){

                graficos.push({
                    index, numFrames,
                    fileNum: parts[1],
                    sX: parts[2],
                    sY: parts[3],
                    w: parts[4],
                    h: parts[5]
                });

            }else{

                let frames = parts.slice(1, 1 + numFrames);
                let speed = parts[1 + numFrames];

                graficos.push({
                    index, numFrames,
                    frames, speed
                });
            }
        }
    }

    graficos.sort((a,b)=>a.index-b.index);

    let size = 8;

    graficos.forEach(g=>{
        size += 4; // index
        size += 4; // short+pad

        if(g.numFrames === 1){
            size += 20;
        }else{
            size += g.numFrames * 4 + 4;
        }
    });

    size += 4;

    let buffer = new ArrayBuffer(size);
    let view = new DataView(buffer);

    let offset = 0;

    function writeLong(v){
        view.setInt32(offset, v, true);
        offset+=4;
    }

    function writeShort(v){
        view.setInt16(offset, v, true);
        offset+=2;
    }

    function writeFloat(v){
        view.setFloat32(offset, v, true);
        offset+=4;
    }

    writeLong(version);
    writeLong(numGrh);

    graficos.forEach(g=>{

        writeLong(g.index);

        writeShort(g.numFrames);
        writeShort(0); // 🔥 padding

        if(g.numFrames === 1){

            writeLong(g.fileNum);
            writeLong(g.sX);
            writeLong(g.sY);
            writeLong(g.w);
            writeLong(g.h);

        }else{

            g.frames.forEach(f=>writeLong(f));
            writeFloat(parseFloat(g.speed));
        }
    });

    writeLong(0);

    let blob = new Blob([buffer], {type:"application/octet-stream"});

    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Graficos.ind";
    a.click();

    alert("✔ IND generado correctamente (formato real)");
}

</script>

</body>
</html>
