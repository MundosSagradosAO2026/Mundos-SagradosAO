<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Extractor TSao ULTIMATE</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<style>
body{background:#0b0b0b;color:#FFD700;font-family:monospace;text-align:center;}
#log{background:#000;color:#0f0;height:180px;overflow:auto;padding:10px;margin-top:10px;font-size:12px;}
#images{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,100px);gap:10px;}
img{width:100px;border:1px solid #333;}
</style>
</head>

<body>

<h2>Extractor TSao ULTIMATE</h2>

<input type="file" id="fileInput"><br><br>
<button onclick="start()">EXTRAER</button>

<div id="log"></div>
<div id="images"></div>

<script>

const logDiv = document.getElementById("log");
const imgDiv = document.getElementById("images");

function log(t){
    logDiv.innerHTML += "> " + t + "<br>";
    logDiv.scrollTop = logDiv.scrollHeight;
}

function readString(bytes, offset, len){
    let s="";
    for(let i=0;i<len;i++){
        if(bytes[offset+i]===0) break;
        s+=String.fromCharCode(bytes[offset+i]);
    }
    return s.trim();
}

// 🔍 firmas
function findCandidates(data){
    let offsets = [];
    for(let i=0;i<data.length-4;i++){
        if(data[i]===0x89 && data[i+1]===0x50) offsets.push(i); // PNG
        if(data[i]===0xFF && data[i+1]===0xD8) offsets.push(i); // JPG
        if(data[i]===0x42 && data[i+1]===0x4D) offsets.push(i); // BMP
        if(data[i]===0x78 && (data[i+1]===0x9C || data[i+1]===0xDA)) offsets.push(i); // ZLIB
        if(data[i]===0x63 || data[i]===0xED) offsets.push(i); // deflate posible
    }
    return offsets;
}

function tryInflate(data){
    try{ return pako.inflateRaw(data); }catch{}
    try{ return pako.inflate(data); }catch{}
    return null;
}

// 🧠 PNG fake
function buildPNG(raw){

    function chunk(type, data){
        let len = data.length;
        let out = new Uint8Array(12 + len);
        let dv = new DataView(out.buffer);
        dv.setUint32(0, len);
        out.set(type,4);
        out.set(data,8);
        dv.setUint32(8+len, 0);
        return out;
    }

    let header = new Uint8Array([137,80,78,71,13,10,26,10]);

    let ihdr = new Uint8Array(13);
    let dv = new DataView(ihdr.buffer);
    dv.setUint32(0,32);
    dv.setUint32(4,32);
    ihdr[8]=8;
    ihdr[9]=6;

    let png = new Uint8Array(header.length + 25 + (12+raw.length) + 12);

    let o=0;
    png.set(header,o); o+=header.length;
    png.set(chunk(new TextEncoder().encode("IHDR"), ihdr),o); o+=25;
    png.set(chunk(new TextEncoder().encode("IDAT"), raw),o); o+=12+raw.length;
    png.set(chunk(new TextEncoder().encode("IEND"), new Uint8Array(0)),o);

    return png;
}

// 🎨 dibujar RAW
function draw(data, w, h, type){
    let canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;

    let ctx = canvas.getContext("2d");
    let imgData = ctx.createImageData(w,h);

    imgData.data.set(data);
    ctx.putImageData(imgData,0,0);

    let img = document.createElement("img");
    img.src = canvas.toDataURL();
    img.title = type;

    imgDiv.appendChild(img);
}

async function start(){

    imgDiv.innerHTML="";
    logDiv.innerHTML="";

    const file = document.getElementById("fileInput").files[0];
    if(!file) return alert("Seleccioná archivo");

    log("Cargando archivo...");

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);

    let numFiles = view.getUint16(4, true);
    if(numFiles<=0 || numFiles>50000){
        numFiles = view.getUint16(12, true);
    }

    log("Archivos: " + numFiles);

    let offset = (numFiles>50000)?14:6;
    let files = [];

    for(let i=0;i<numFiles;i++){
        let start = view.getUint32(offset, true);
        let size = view.getUint32(offset+4, true);
        let name = readString(bytes, offset+8, 32);
        files.push({start,size,name});
        offset += 44;
    }

    log("Index leído");

    let ok=0, fail=0;

    for(let i=0;i<files.length;i++){

        let f = files[i];

        try{

            let raw = bytes.slice(f.start, f.start + f.size + 800);
            let candidates = findCandidates(raw);

            let out = null;
            let mime = "image/png";

            for(let c of candidates){

                let slice = raw.slice(c);

                if(slice[0]===0x89 && slice[1]===0x50){
                    out = slice; mime="image/png"; break;
                }

                if(slice[0]===0xFF && slice[1]===0xD8){
                    out = slice; mime="image/jpeg"; break;
                }

                if(slice[0]===0x42 && slice[1]===0x4D){
                    out = slice; mime="image/bmp"; break;
                }

                let infl = tryInflate(slice);

                if(infl){
                    if(infl[0]===0x89){
                        out = infl;
                    }else{
                        out = buildPNG(infl);
                    }
                    break;
                }
            }

            if(!out) throw "fail";

            let blob = new Blob([out], {type:mime});
            let img = document.createElement("img");

            img.src = URL.createObjectURL(blob);
            img.title = f.name;

            imgDiv.appendChild(img);

            ok++;

        }catch{

            try{

                let raw = bytes.slice(f.start, f.start + f.size);
                let sizes = [16,32,64,96,128];

                for(let s of sizes){

                    // RGBA
                    if(raw.length >= s*s*4){
                        draw(raw.slice(0,s*s*4), s, s, "RGBA");
                        ok++; throw "done";
                    }

                    // RGB
                    if(raw.length >= s*s*3){
                        let rgba = new Uint8Array(s*s*4);
                        for(let i=0,j=0;i<rgba.length;i+=4,j+=3){
                            rgba[i]=raw[j];
                            rgba[i+1]=raw[j+1];
                            rgba[i+2]=raw[j+2];
                            rgba[i+3]=255;
                        }
                        draw(rgba,s,s,"RGB");
                        ok++; throw "done";
                    }

                    // BGR
                    if(raw.length >= s*s*3){
                        let rgba = new Uint8Array(s*s*4);
                        for(let i=0,j=0;i<rgba.length;i+=4,j+=3){
                            rgba[i]=raw[j+2];
                            rgba[i+1]=raw[j+1];
                            rgba[i+2]=raw[j];
                            rgba[i+3]=255;
                        }
                        draw(rgba,s,s,"BGR");
                        ok++; throw "done";
                    }

                    // GRAY
                    if(raw.length >= s*s){
                        let rgba = new Uint8Array(s*s*4);
                        for(let i=0;i<s*s;i++){
                            let v = raw[i];
                            rgba[i*4]=v;
                            rgba[i*4+1]=v;
                            rgba[i*4+2]=v;
                            rgba[i*4+3]=255;
                        }
                        draw(rgba,s,s,"GRAY");
                        ok++; throw "done";
                    }
                }

                fail++;

            }catch(e){

                if(e !== "done"){
                    fail++;
                    if(fail < 20){
                        log("Error en " + f.name);
                    }
                }
            }
        }

        if(i % 20 === 0){
            await new Promise(r=>setTimeout(r,1));
        }
    }

    log("OK: " + ok);
    log("Errores: " + fail);
    log("FIN");
}

</script>

</body>
</html>
