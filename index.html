<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AO IND Parser - Versión Estable</title>
    <style>
        body { background: #1a1a1a; color: #eee; font-family: monospace; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: #252525; padding: 20px; border-radius: 10px; border: 1px solid #FFD700; }
        #console { background: #000; color: #0f0; padding: 15px; height: 300px; overflow-y: auto; text-align: left; margin: 15px 0; border-radius: 5px; font-size: 12px; }
        input[type="file"] { margin: 20px 0; }
        button { background: #FFD700; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        button:disabled { background: #555; cursor: not-allowed; }
        .err { color: #ff4444; }
        .warn { color: #ffa500; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚔️ Lector Graficos.ind (Estilo Python)</h2>
    <input type="file" id="fileInput" accept=".ind">
    <br>
    <button id="btnProcess" onclick="procesar()">Procesar Archivo</button>
    <button id="btnDownload" onclick="descargar()" disabled>Descargar .ini</button>
    
    <div id="console">Selecciona el archivo para empezar...</div>
</div>

<script>
    let resultadoIni = "";
    const MAX_FRAMES = 1000; // El mismo límite que usamos en Python

    function log(msg, cls = "") {
        const div = document.createElement("div");
        div.className = cls;
        div.innerText = `> ${msg}`;
        const con = document.getElementById("console");
        con.appendChild(div);
        con.scrollTop = con.scrollHeight;
    }

    function procesar() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return alert("Selecciona un archivo");

        const reader = new FileReader();
        document.getElementById("console").innerHTML = "";
        log(`Leyendo ${file.name}...`);

        reader.onload = function(e) {
            const view = new DataView(e.target.result);
            let offset = 0;
            let leidos = 0;

            try {
                // Leer Cabecera (Longs de 4 bytes)
                const version = view.getInt32(offset, true); offset += 4;
                const totalGrhs = view.getInt32(offset, true); offset += 4;

                let ini = `[INIT]\nNumGrh=${totalGrhs}\nVersion=${version}\n\n[Graphics]\n`;
                log(`Header detectado: Versión ${version}, Total: ${totalGrhs}`);

                // Empezar lectura de datos
                while (offset + 4 <= view.byteLength) {
                    const grhIndex = view.getInt32(offset, true); offset += 4;
                    
                    // Si el índice es 0, terminamos (Fin de archivo estándar AO)
                    if (grhIndex === 0) break;

                    // Si el índice es muy loco, probablemente nos desalineamos
                    if (grhIndex < 0 || grhIndex > 1000000) {
                        log(`Error de alineación en byte ${offset}. Índice inválido: ${grhIndex}`, "err");
                        break;
                    }

                    const numFrames = view.getInt32(offset, true); offset += 4;

                    if (numFrames === 1) {
                        // Gráfico Estático
                        const fileNum = view.getInt32(offset, true); offset += 4;
                        const sX = view.getInt32(offset, true); offset += 4;
                        const sY = view.getInt32(offset, true); offset += 4;
                        const w = view.getInt32(offset, true); offset += 4;
                        const h = view.getInt32(offset, true); offset += 4;

                        ini += `Grh${grhIndex}=1-${fileNum}-${sX}-${sY}-${w}-${h}\n`;
                    } 
                    else if (numFrames > 1) {
                        // Animación
                        let frames = [];
                        
                        // Lógica de seguridad para NumFrames gigantes
                        const realFramesToRead = Math.min(numFrames, MAX_FRAMES);
                        if (numFrames > MAX_FRAMES) {
                            log(`Grh${grhIndex}: NumFrames excesivo (${numFrames}). Limitando a ${MAX_FRAMES}.`, "warn");
                        }

                        for (let i = 0; i < realFramesToRead; i++) {
                            if (offset + 4 <= view.byteLength) {
                                frames.push(view.getInt32(offset, true));
                                offset += 4;
                            }
                        }

                        // Si el archivo tenía más frames de los que leímos, saltamos el resto 
                        // para intentar seguir con el siguiente GrhIndex
                        if (numFrames > MAX_FRAMES) {
                            const bytesToSkip = (numFrames - MAX_FRAMES) * 4;
                            offset += bytesToSkip;
                        }

                        // Velocidad (Float)
                        const speed = (offset + 4 <= view.byteLength) ? view.getFloat32(offset, true) : 0;
                        offset += 4;

                        ini += `Grh${grhIndex}=${numFrames}-${frames.join("-")}-${Math.round(speed)}\n`;
                    }

                    leidos++;
                    if (leidos % 5000 === 0) log(`Procesados ${leidos} registros...`);
                }

                resultadoIni = ini;
                document.getElementById("btnDownload").disabled = false;
                log(`¡Éxito! Se leyeron ${leidos} gráficos.`, "success");

            } catch (err) {
                log(`Error crítico: ${err.message}`, "err");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function descargar() {
        const blob = new Blob([resultadoIni], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Graficos.ini";
        a.click();
    }
</script>

</body>
</html>
