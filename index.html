<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys - Suite de Desarrollo AO</title>
    <style>
        body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* --- ESTILOS DEL MENÚ PRINCIPAL --- */
        #mainMenu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; transition: 0.3s; }
        .logo-title { font-size: 3em; text-shadow: 0 0 15px #00ff00; margin-bottom: 20px; color: #fff; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 80%; max-width: 800px; }
        .card { background: #1e1e1e; border: 2px solid #333; padding: 30px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .card:hover { border-color: #00adb5; transform: translateY(-5px); background: #252525; box-shadow: 0 5px 20px rgba(0, 173, 181, 0.3); }
        .card i { font-size: 2em; display: block; margin-bottom: 10px; }

        /* --- ESTILOS DEL EDITOR --- */
        #editorContainer { display: none; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; flex-wrap: wrap; }
        
        .editor-layout { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        #editor { flex: 2; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; resize: none; outline: none; border-radius: 4px; }
        
        /* --- PANEL DE VALIDACIÓN --- */
        #validatorPanel { flex: 1; background: #111; border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; }
        .val-header { background: #222; padding: 10px; font-size: 12px; border-bottom: 1px solid #333; color: #00adb5; font-weight: bold; }
        #valList { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; line-height: 1.6; }
        .missing { color: #ff4d4d; font-weight: bold; background: rgba(255, 77, 77, 0.1); padding: 2px 5px; display: block; }
        .correct { color: #888; display: block; }

        /* --- BOTONES --- */
        .btn { padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; transition: 0.2s; font-family: 'Consolas', monospace; }
        .btn-ind { background: #00adb5; color: white; }
        .btn-ind:hover { background: #008a91; }
        .btn-ini { background: #444; color: white; }
        .btn-validate { background: #f39c12; color: black; }
        .btn-back { background: #ff4d4d; color: white; margin-right: 15px; }
        
        .status { color: #888; font-size: 12px; margin-left: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="logo-title">AMNERYS DESARROLLO</div>
        <div class="grid-buttons">
            <div class="card" onclick="openEditor()">
                <span>🖼️</span>
                <h3>Editor Index AO</h3>
                <p>Gestionar Graficos.ind / .ini</p>
            </div>
            
            <div class="card" style="opacity: 0.5; cursor: not-allowed;">
                <span>⚔️</span>
                <h3>Editor de Items</h3>
                <p>(Próximamente)</p>
            </div>
            
            <div class="card" style="opacity: 0.5; cursor: not-allowed;">
                <span>🧙‍♂️</span>
                <h3>Editor de NPCs</h3>
                <p>(Próximamente)</p>
            </div>
        </div>
    </div>

    <div id="editorContainer">
        <div class="header">
            <button class="btn btn-back" onclick="closeEditor()">← Volver</button>
            <strong>Editor de Gráficos</strong>
            <input type="file" id="loadInd" style="display:none">
            <input type="file" id="folderInput" style="display:none" multiple accept="image/*">
            
            <button class="btn btn-ini" onclick="document.getElementById('loadInd').click()">Cargar .IND</button>
            <button class="btn btn-validate" onclick="document.getElementById('folderInput').click()">📁 Validar Secuencia Gráficos</button>
            
            <button class="btn btn-ind" onclick="saveInd()">Descargar .IND</button>
            <button class="btn btn-ini" onclick="saveIni()">Descargar .INI</button>
            <div class="status" id="status">Esperando archivo...</div>
        </div>

        <div class="editor-layout">
            <textarea id="editor" placeholder="Pega aquí el contenido de tu .ini o carga un .ind..."></textarea>
            
            <div id="validatorPanel">
                <div class="val-header">REPORTE DE SECUENCIA (IMG)</div>
                <div id="valList">Selecciona la carpeta de imágenes para analizar faltantes...</div>
            </div>
        </div>
    </div>

<script>
    function openEditor() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('editorContainer').style.display = 'flex';
    }

    function closeEditor() {
        document.getElementById('mainMenu').classList.remove('hidden');
        document.getElementById('editorContainer').style.display = 'none';
    }

    const editor = document.getElementById('editor');
    const status = document.getElementById('status');
    const valList = document.getElementById('valList');
    let version = 447;

    // --- LÓGICA DE VALIDACIÓN DE ARCHIVOS ---
    document.getElementById('folderInput').onchange = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        // Extraer números de los nombres (ej: "123.png" -> 123)
        let numbers = files
            .map(f => parseInt(f.name.split('.')[0]))
            .filter(n => !isNaN(n))
            .sort((a, b) => a - b);

        if (numbers.length === 0) {
            valList.innerHTML = "<span style='color:orange'>No se encontraron archivos con nombre numérico.</span>";
            return;
        }

        const min = numbers[0];
        const max = numbers[numbers.length - 1];
        let htmlReport = "";
        let missingCount = 0;

        // Crear set para búsqueda rápida
        const numSet = new Set(numbers);

        for (let i = min; i <= max; i++) {
            if (numSet.has(i)) {
                htmlReport += `<span class="correct">✔ Archivo ${i}</span>`;
            } else {
                htmlReport += `<span class="missing">✖ FALTA: Archivo ${i}</span>`;
                missingCount++;
            }
        }

        valList.innerHTML = htmlReport;
        status.innerText = `Análisis: ${numbers.length} archivos. Faltan: ${missingCount}.`;
        valList.scrollTop = 0;
    };

    // --- LÓGICA ORIGINAL DEL EDITOR ---
    document.getElementById('loadInd').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Procesando binario...";
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 0;

        try {
            version = view.getInt32(offset, true); offset += 4;
            const total = view.getInt32(offset, true); offset += 4;
            let text = `[INIT]\nNumGrh=${total}\nVersion=${version}\n\n[Graphics]\n`;
            
            while (offset < buffer.byteLength) {
                if (offset + 4 > buffer.byteLength) break;
                const index = view.getInt32(offset, true); offset += 4;
                if (index <= 0) break;
                const frames = view.getInt16(offset, true); offset += 2;
                
                if (frames === 1) {
                    const f = view.getInt32(offset, true); offset += 4;
                    const x = view.getInt16(offset, true); offset += 2;
                    const y = view.getInt16(offset, true); offset += 2;
                    const w = view.getInt16(offset, true); offset += 2;
                    const h = view.getInt16(offset, true); offset += 2;
                    text += `Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
                } else {
                    let ids = [];
                    for(let i=0; i<frames; i++) { ids.push(view.getInt32(offset, true)); offset += 4; }
                    const spd = view.getFloat32(offset, true).toFixed(3).replace(/\.?0+$/, ""); offset += 4;
                    text += `Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
                }
            }
            editor.value = text;
            status.innerText = `Cargados ${total} registros.`;
        } catch(err) {
            status.innerText = "Error en el formato binario.";
        }
    };

    function saveInd() {
        const lines = editor.value.split('\n');
        let grhs = [];
        let numGrh = 0;

        lines.forEach(line => {
            if (line.includes('Version=')) version = parseInt(line.split('=')[1]);
            if (line.includes('NumGrh=')) numGrh = parseInt(line.split('=')[1]);
            if (line.startsWith('Grh')) {
                const parts = line.split('=');
                const idx = parseInt(parts[0].replace('Grh', ''));
                const data = parts[1].split('-');
                grhs.push({ idx, data });
            }
        });

        const buffer = new ArrayBuffer(grhs.length * 80 + 100);
        const view = new DataView(buffer);
        let offset = 0;

        view.setInt32(offset, version, true); offset += 4;
        view.setInt32(offset, numGrh || grhs.length, true); offset += 4;

        grhs.forEach(g => {
            view.setInt32(offset, g.idx, true); offset += 4;
            const frames = parseInt(g.data[0]);
            view.setInt16(offset, frames, true); offset += 2;

            if (frames === 1) {
                view.setInt32(offset, parseInt(g.data[1]), true); offset += 4;
                view.setInt16(offset, parseInt(g.data[2]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[3]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[4]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[5]), true); offset += 2;
            } else {
                for(let i=1; i<=frames; i++) {
                    view.setInt32(offset, parseInt(g.data[i]), true); offset += 4;
                }
                view.setFloat32(offset, parseFloat(g.data[frames+1]), true); offset += 4;
            }
        });

        view.setInt32(offset, 0, true); offset += 4;
        download(buffer.slice(0, offset), "Graficos.ind", "application/octet-stream");
    }

    function saveIni() { download(editor.value, "Graficos.ini", "text/plain"); }

    function download(content, name, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    }
</script>
</body>
</html>
