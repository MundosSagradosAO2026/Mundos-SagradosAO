<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor Graficos.ind</title>

<style>
body{
    background:#0b0b0b;
    color:#FFD700;
    font-family: monospace;
    text-align:center;
    padding:40px;
}
.box{
    border:1px solid #FFD700;
    padding:20px;
    max-width:700px;
    margin:auto;
    background:#111;
}
button{
    background:#FFD700;
    border:none;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
    font-weight:bold;
}
pre{
    text-align:left;
    background:#000;
    padding:10px;
    height:300px;
    overflow:auto;
    color:#0f0;
}
</style>
</head>

<body>

<div class="box">
    <h2>📦 Lector Graficos.ind</h2>

    <input type="file" id="fileInput"><br>

    <button onclick="procesar()">Leer Archivo</button>
    <button onclick="descargar()">Descargar .ini</button>

    <p id="info"></p>

    <pre id="output"></pre>
</div>

<script>
let iniTexto = "";

function readLong(view, offset){
    return view.getInt32(offset, true);
}

function readFloat(view, offset){
    return view.getFloat32(offset, true);
}

function procesar(){
    const file = document.getElementById("fileInput").files[0];
    if(!file){
        alert("Subí un archivo primero");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){
        const buffer = e.target.result;
        const view = new DataView(buffer);

        let offset = 0;

        let version = readLong(view, offset); offset+=4;
        let grhCount = readLong(view, offset); offset+=4;

        let ini = "[INIT]\n";
        ini += "NumGrh=" + grhCount + "\n";
        ini += "Version=" + version + "\n\n";

        let leidos = 0;

        while(true){
            if(offset >= view.byteLength) break;

            let grhIndex = readLong(view, offset); offset+=4;

            if(grhIndex === 0) break;

            let NumFrames = readLong(view, offset); offset+=4;

            if(NumFrames === 1){

                let FileNum = readLong(view, offset); offset+=4;
                let sX = readLong(view, offset); offset+=4;
                let sY = readLong(view, offset); offset+=4;
                let w = readLong(view, offset); offset+=4;
                let h = readLong(view, offset); offset+=4;

                ini += `Grh${grhIndex}=${NumFrames}-${FileNum}-${sX}-${sY}-${w}-${h}\n`;

            }else{

                let frames = [];

                for(let i=0;i<NumFrames;i++){
                    frames.push(readLong(view, offset));
                    offset+=4;
                }

                let speed = readFloat(view, offset); offset+=4;
                speed = Math.round(speed);

                ini += `Grh${grhIndex}=${NumFrames}-${frames.join("-")}-${speed}\n`;
            }

            leidos++;
        }

        iniTexto = ini;

        document.getElementById("info").innerText =
            "✔ Version: " + version +
            " | Declarados: " + grhCount +
            " | Leídos: " + leidos;

        document.getElementById("output").innerText = ini.substring(0,2000);
    };

    reader.readAsArrayBuffer(file);
}

function descargar(){
    if(!iniTexto){
        alert("Primero leé el archivo");
        return;
    }

    const blob = new Blob([iniTexto], {type:"text/plain"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Graficos.ini";
    a.click();
}
</script>

</body>
</html>
