<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys - Suite de Desarrollo AO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* --- MENÚ PRINCIPAL --- */
        #mainMenu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; transition: 0.3s; }
        .logo-title { font-size: 3em; text-shadow: 0 0 15px #00ff00; margin-bottom: 20px; color: #fff; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 80%; max-width: 800px; }
        .card { background: #1e1e1e; border: 2px solid #333; padding: 30px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .card:hover { border-color: #00adb5; transform: translateY(-5px); background: #252525; box-shadow: 0 5px 20px rgba(0, 173, 181, 0.3); }
        .card span { font-size: 2.5em; display: block; margin-bottom: 10px; }

        /* --- CONTENEDORES COMUNES --- */
        .view-container { display: none; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        
        /* --- EDITOR INDEX --- */
        #editor { flex: 1; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; resize: none; outline: none; border-radius: 4px; }
        
        /* --- UNPACKER TSAO --- */
        .unpacker-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .side-panel { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .gallery { background: #000; border-radius: 8px; border: 1px solid #333; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; align-content: start; }
        .img-card { background: #111; border: 1px solid #444; padding: 5px; text-align: center; font-size: 10px; }
        .img-card img { max-width: 100%; height: auto; image-rendering: pixelated; margin-bottom: 5px; }

        /* --- BOTONES --- */
        .btn { padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; transition: 0.2s; white-space: nowrap; }
        .btn-ind { background: #00adb5; color: white; }
        .btn-ini { background: #444; color: white; }
        .btn-back { background: #ff4d4d; color: white; }
        .status { color: #888; font-size: 12px; margin-left: auto; }
        .hidden { display: none !important; }
        input[type="file"] { font-size: 11px; color: #888; }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="logo-title">AMNERYS DESARROLLO</div>
        <div class="grid-buttons">
            <div class="card" onclick="showView('editorContainer')">
                <span>🖼️</span>
                <h3>Editor Index AO</h3>
                <p>Gestionar Graficos.ind / .ini</p>
            </div>
            
            <div class="card" onclick="showView('unpackerContainer')">
                <span>📦</span>
                <h3>Unpacker .TSAO</h3>
                <p>Desencriptar y Ver Gráficos</p>
            </div>
            
            <div class="card" style="opacity: 0.5; cursor: not-allowed;">
                <span>⚔️</span>
                <h3>Editor de Items</h3>
                <p>(Próximamente)</p>
            </div>
        </div>
    </div>

    <div id="editorContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">← Volver</button>
            <strong>Editor Manual de Gráficos</strong>
            <input type="file" id="loadInd" style="display:none">
            <button class="btn btn-ini" onclick="document.getElementById('loadInd').click()">Cargar .IND</button>
            <button class="btn btn-ind" onclick="saveInd()">Descargar .IND</button>
            <button class="btn btn-ini" onclick="saveIni()">Descargar .INI</button>
            <div class="status" id="status">Esperando archivo...</div>
        </div>
        <textarea id="editor" placeholder="Pega el contenido de tu .ini o carga un .ind..."></textarea>
    </div>

    <div id="unpackerContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">← Volver</button>
            <strong>Desencriptador de Gráficos .TSAO</strong>
            <div class="status" id="unpackerStatus">Carga los archivos para ver el contenido</div>
        </div>
        
        <div class="unpacker-layout">
            <div class="side-panel">
                <label>1. Grh_path.tsao (Índice):</label>
                <input type="file" id="filePaths" accept=".tsao">
                
                <label>2. Grh.tsao (Datos):</label>
                <input type="file" id="fileData" accept=".tsao">
                
                <button class="btn btn-ind" id="btnStartUnpack" style="margin-top:10px">EXTRAER Y VISUALIZAR</button>
                
                <div id="logArea" style="flex:1; background:#000; padding:10px; font-size:11px; overflow-y:auto; border:1px solid #333; color:#aaa;">
                    Listo para procesar...
                </div>
            </div>
            
            <div class="gallery" id="imageGallery">
                </div>
        </div>
    </div>

<script>
    // Navegación Global
    function showView(viewId) {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('editorContainer').style.display = 'none';
        document.getElementById('unpackerContainer').style.display = 'none';
        
        if (viewId === 'mainMenu') {
            document.getElementById('mainMenu').classList.remove('hidden');
        } else {
            document.getElementById(viewId).style.display = 'flex';
        }
    }

    // --- LÓGICA DEL EDITOR INDEX ---
    const editor = document.getElementById('editor');
    const status = document.getElementById('status');
    let version = 447;

    document.getElementById('loadInd').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        status.innerText = "Procesando...";
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 0;
        version = view.getInt32(offset, true); offset += 4;
        const total = view.getInt32(offset, true); offset += 4;
        let text = `[INIT]\nNumGrh=${total}\nVersion=${version}\n\n[Graphics]\n`;
        try {
            while (offset < buffer.byteLength) {
                if (offset + 4 > buffer.byteLength) break;
                const index = view.getInt32(offset, true); offset += 4;
                if (index <= 0) break;
                const frames = view.getInt16(offset, true); offset += 2;
                if (frames === 1) {
                    const f = view.getInt32(offset, true); offset += 4;
                    const x = view.getInt16(offset, true); offset += 2;
                    const y = view.getInt16(offset, true); offset += 2;
                    const w = view.getInt16(offset, true); offset += 2;
                    const h = view.getInt16(offset, true); offset += 2;
                    text += `Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
                } else {
                    let ids = [];
                    for(let i=0; i<frames; i++) { ids.push(view.getInt32(offset, true)); offset += 4; }
                    const spd = view.getFloat32(offset, true).toFixed(3).replace(/\.?0+$/, ""); offset += 4;
                    text += `Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
                }
            }
            editor.value = text;
            status.innerText = `Cargados ${total} registros.`;
        } catch(err) { status.innerText = "Error en formato."; }
    };

    function saveInd() {
        const lines = editor.value.split('\n');
        let grhs = [];
        let numGrh = 0;
        lines.forEach(line => {
            if (line.includes('Version=')) version = parseInt(line.split('=')[1]);
            if (line.includes('NumGrh=')) numGrh = parseInt(line.split('=')[1]);
            if (line.startsWith('Grh')) {
                const parts = line.split('=');
                const idx = parseInt(parts[0].replace('Grh', ''));
                const data = parts[1].split('-');
                grhs.push({ idx, data });
            }
        });
        const buffer = new ArrayBuffer(grhs.length * 80 + 100);
        const view = new DataView(buffer);
        let offset = 0;
        view.setInt32(offset, version, true); offset += 4;
        view.setInt32(offset, numGrh || grhs.length, true); offset += 4;
        grhs.forEach(g => {
            view.setInt32(offset, g.idx, true); offset += 4;
            const frames = parseInt(g.data[0]);
            view.setInt16(offset, frames, true); offset += 2;
            if (frames === 1) {
                view.setInt32(offset, parseInt(g.data[1]), true); offset += 4;
                view.setInt16(offset, parseInt(g.data[2]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[3]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[4]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[5]), true); offset += 2;
            } else {
                for(let i=1; i<=frames; i++) { view.setInt32(offset, parseInt(g.data[i]), true); offset += 4; }
                view.setFloat32(offset, parseFloat(g.data[frames+1]), true); offset += 4;
            }
        });
        download(buffer.slice(0, offset), "Graficos.ind", "application/octet-stream");
    }

    function saveIni() { download(editor.value, "Graficos.ini", "text/plain"); }

    // --- LÓGICA DEL UNPACKER TSAO ---
    document.getElementById('btnStartUnpack').onclick = async () => {
        const pathFile = document.getElementById('filePaths').files[0];
        const dataFile = document.getElementById('fileData').files[0];
        const log = document.getElementById('logArea');
        const gallery = document.getElementById('imageGallery');

        if (!pathFile || !dataFile) return alert("Carga ambos archivos .tsao");

        log.innerHTML = "Iniciando desencriptación...<br>";
        gallery.innerHTML = "";
        
        const pathBuffer = await pathFile.arrayBuffer();
        const dataBuffer = await dataFile.arrayBuffer();
        const pathView = new DataView(pathBuffer);
        const dataBytes = new Uint8Array(dataBuffer);
        
        const clave = "quierovalecuatro";
        const datCM = clave.split('').map(c => c.charCodeAt(0));
        
        // El número de archivos suele estar en el byte 4
        const numFiles = pathView.getInt16(4, true);
        log.innerHTML += `Archivos: ${numFiles}<br>`;

        let offset = 6; 
        for (let i = 0; i < numFiles; i++) {
            if (offset + 44 > pathBuffer.byteLength) break;

            const startPos = pathView.getUint32(offset, true);
            const size = pathView.getUint32(offset + 4, true);
            
            // Leer Nombre
            let nameBytes = new Uint8Array(pathBuffer, offset + 8, 32);
            let fileName = new TextDecoder().decode(nameBytes).replace(/\0/g, '').trim();
            offset += 44;

            // Extraer y XOR
            let chunk = dataBytes.slice(startPos, startPos + size);
            for (let j = 0; j < chunk.length; j++) {
                chunk[j] = chunk[j] ^ datCM[j % datCM.length];
            }

            try {
                // Descomprimir
                const decompressed = pako.inflate(chunk);
                const blob = new Blob([decompressed], { type: 'image/png' });
                const url = URL.createObjectURL(blob);

                // Añadir a Galería
                const div = document.createElement('div');
                div.className = 'img-card';
                div.innerHTML = `<img src="${url}"><br>${fileName}`;
                gallery.appendChild(div);

                if (i % 50 === 0) {
                    log.innerHTML += `Procesando: ${fileName}...<br>`;
                    log.scrollTop = log.scrollHeight;
                    await new Promise(r => setTimeout(r, 1)); 
                }
            } catch (e) {
                console.error("Error en archivo", fileName);
            }
        }
        log.innerHTML += "<strong>¡Completado!</strong>";
    };

    function download(content, name, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    }
</script>
</body>
</html>
