<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Detector XOR TSAO</title>
</head>
<body style="background:#000;color:#0f0;font-family:monospace">

<input type="file" id="file">
<div id="log"></div>
<div id="imgs"></div>

<script>
const log = (t)=>document.getElementById("log").innerHTML += "> "+t+"<br>";

document.getElementById("file").onchange = async e => {

    let file = e.target.files[0];
    let buffer = await file.arrayBuffer();
    let bytes = new Uint8Array(buffer);

    log("Archivo cargado");

    const pngSig = [0x89,0x50,0x4E,0x47];

    // probar XOR 0-255
    for(let key=0; key<256; key++){

        for(let i=0;i<100000;i++){ // solo primeras posiciones

            let ok = true;

            for(let j=0;j<4;j++){
                if((bytes[i+j] ^ key) !== pngSig[j]){
                    ok = false;
                    break;
                }
            }

            if(ok){
                log("🔥 POSIBLE XOR KEY: " + key);

                // reconstruir archivo XOR completo
                let decoded = new Uint8Array(bytes.length);

                for(let k=0;k<bytes.length;k++){
                    decoded[k] = bytes[k] ^ key;
                }

                // mostrar imagen desde inicio detectado
                let blob = new Blob([decoded.slice(i, i+50000)], {type:"image/png"});
                let url = URL.createObjectURL(blob);

                let img = document.createElement("img");
                img.src = url;
                img.style.width = "200px";

                document.getElementById("imgs").appendChild(img);

                return;
            }
        }
    }

    log("No se encontró XOR simple");
};
</script>

</body>
</html>
