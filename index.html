<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TSao Extractor FINAL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<style>
body{
    background:#0b0b0b;
    color:#FFD700;
    font-family: monospace;
    text-align:center;
}

#log{
    background:#000;
    color:#00ff00;
    height:180px;
    overflow:auto;
    padding:10px;
    margin-top:10px;
    font-size:12px;
}

#images{
    margin-top:20px;
    display:grid;
    grid-template-columns: repeat(auto-fill, 100px);
    gap:10px;
}

img{
    width:100px;
    border:1px solid #333;
}

#dump{
    background:#111;
    color:#0ff;
    height:150px;
    overflow:auto;
    margin-top:10px;
    padding:10px;
    font-size:11px;
}
</style>
</head>

<body>

<h2>Extractor Grh.tsao FINAL</h2>

<input type="file" id="fileInput">
<br><br>
<button onclick="start()">EXTRAER</button>

<div id="log"></div>
<div id="dump"></div>
<div id="images"></div>

<script>

const logDiv = document.getElementById("log");
const dumpDiv = document.getElementById("dump");
const imgDiv = document.getElementById("images");

function log(t){
    logDiv.innerHTML += "> " + t + "<br>";
    logDiv.scrollTop = logDiv.scrollHeight;
}

function hexDump(arr, max=64){
    let s="";
    for(let i=0;i<Math.min(arr.length,max);i++){
        s += arr[i].toString(16).padStart(2,"0")+" ";
    }
    return s;
}

// clave VB6
const keyStr = "quierovalecuatro";
const key = new Uint8Array([...keyStr].map(c=>c.charCodeAt(0)));

function readString(bytes, offset, len){
    let s="";
    for(let i=0;i<len;i++){
        if(bytes[offset+i]===0) break;
        s+=String.fromCharCode(bytes[offset+i]);
    }
    return s.trim();
}

function xorFull(data){
    let out = new Uint8Array(data.length);
    for(let i=0;i<data.length;i++){
        out[i] = data[i] ^ key[i % key.length];
    }
    return out;
}

function xorOffset(data, offset){
    let out = new Uint8Array(data.length);
    for(let i=0;i<data.length;i++){
        out[i] = data[i] ^ key[(i+offset) % key.length];
    }
    return out;
}

function tryAll(data, offset){

    // 1 RAW DEFLATE
    try{
        return pako.inflateRaw(data);
    }catch{}

    // 2 ZLIB
    try{
        return pako.inflate(data);
    }catch{}

    // 3 XOR FULL + RAW
    try{
        return pako.inflateRaw(xorFull(data));
    }catch{}

    // 4 XOR FULL + ZLIB
    try{
        return pako.inflate(xorFull(data));
    }catch{}

    // 5 XOR OFFSET + RAW
    try{
        return pako.inflateRaw(xorOffset(data, offset));
    }catch{}

    // 6 XOR OFFSET + ZLIB
    try{
        return pako.inflate(xorOffset(data, offset));
    }catch{}

    return null;
}

async function start(){

    imgDiv.innerHTML="";
    logDiv.innerHTML="";
    dumpDiv.innerHTML="";

    const file = document.getElementById("fileInput").files[0];
    if(!file) return alert("Seleccioná archivo");

    log("Cargando archivo...");

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);

    let numFiles = view.getUint16(4, true);

    if(numFiles<=0 || numFiles>50000){
        numFiles = view.getUint16(12, true);
        log("Header corregido");
    }

    log("Archivos: " + numFiles);

    let offset = (numFiles>50000)?14:6;

    let files = [];

    for(let i=0;i<numFiles;i++){

        let start = view.getUint32(offset, true);
        let size = view.getUint32(offset+4, true);
        let name = readString(bytes, offset+8, 32);
        let usize = view.getUint32(offset+40, true);

        files.push({start,size,name,usize});
        offset += 44;
    }

    log("Index leído");

    // DEBUG PRIMER ARCHIVO
    let test = files[0];
    let raw = bytes.slice(test.start, test.start + test.size);

    dumpDiv.innerHTML += "RAW:\n" + hexDump(raw) + "\n\n";

    let ok=0, fail=0;

    for(let i=0;i<files.length;i++){

        let f = files[i];

        try{

            let data = bytes.slice(f.start, f.start + f.size);

            let out = tryAll(data, f.start);

            if(!out) throw "fail";

            let blob = new Blob([out], {type:"image/png"});
            let img = document.createElement("img");
            img.src = URL.createObjectURL(blob);
            img.title = f.name;

            imgDiv.appendChild(img);

            ok++;

        }catch(e){
            fail++;
            if(fail < 20){
                log("Error en " + f.name);
            }
        }

        if(i % 50 === 0){
            await new Promise(r=>setTimeout(r,1));
        }
    }

    log("OK: " + ok);
    log("Errores: " + fail);
    log("FIN");

}

</script>

</body>
</html>
