<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundos Sagrados - Argentum Online</title>

<!-- ICONO EN LA PESTAÑA -->
<link rel="icon" type="image/x-icon" href="MundosSagrados.ico">

<!-- FUENTE -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: #000;
    font-family: 'Cinzel', serif;
    color: white;
    overflow-x: hidden;
    letter-spacing: 1px;
}

/* ===== FONDO FUEGO ===== */
#fireCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

/* ===== LOGO ARRIBA ===== */
header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 0 20px 0;
}

#logoImg {
    max-width: 320px;
    display: block;
    margin: 0 auto;
}

/* ===== CONTROLES MUSICA ===== */
.music-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2;
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 15px rgba(255,140,0,0.5);
}

.music-btn {
    font-size: 22px;
    background: none;
    border: none;
    color: orange;
    cursor: pointer;
}

.volume-slider {
    width: 100px;
    margin-top: 6px;
}

/* ===== FOOTER ===== */
footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    margin-top: 80px;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    border-top: 1px solid rgba(255,140,0,0.3);
}

</style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<!-- CONTROLES -->
<div class="music-controls">
    <button id="musicToggle" class="music-btn">🔊</button><br>
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<!-- LOGO -->
<header>
    <img id="logoImg" src="logo.png" alt="Mundos Sagrados">
</header>

<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<!-- MUSICA -->
<audio id="bgMusic" autoplay loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== MUSICA ===== */

const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");
const volumeSlider = document.getElementById("volumeControl");

let isPlaying = false;

/* Intentar autoplay */
window.addEventListener("load", () => {
    music.volume = 0.5;
    const playPromise = music.play();

    if (playPromise !== undefined) {
        playPromise.then(() => {
            isPlaying = true;
            toggleBtn.textContent = "🔊";
        }).catch(() => {
            // Si el navegador bloquea autoplay
            document.addEventListener("click", () => {
                music.play();
                isPlaying = true;
                toggleBtn.textContent = "🔊";
            }, { once: true });
        });
    }
});

/* Botón activar/desactivar */
toggleBtn.addEventListener("click", () => {
    if(isPlaying){
        music.pause();
        toggleBtn.textContent = "🔇";
    } else {
        music.play();
        toggleBtn.textContent = "🔊";
    }
    isPlaying = !isPlaying;
});

/* Control volumen */
volumeSlider.addEventListener("input", () => {
    music.volume = volumeSlider.value;
});

/* ===== FUEGO SIMPLE ===== */

const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let sparks = [];

class Spark {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 2 + 1;
        this.opacity = Math.random();
    }

    update() {
        this.y -= this.speedY;
        this.opacity -= 0.01;
    }

    draw() {
        ctx.fillStyle = `rgba(255, ${Math.random()*200}, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sparks.length < 80) sparks.push(new Spark());

    sparks.forEach((spark, index) => {
        spark.update();
        spark.draw();
        if (spark.opacity <= 0) sparks.splice(index, 1);
    });
}

animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
</body>
</html>
