<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor Graficos.ind PRO - Amnerys</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 20px; }
        .container { max-width: 900px; margin: auto; background: #2d2d2d; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00adb5; border-bottom: 2px solid #393e46; padding-bottom: 10px; }
        .upload-section { border: 2px dashed #393e46; padding: 20px; text-align: center; margin-bottom: 20px; transition: 0.3s; }
        .upload-section:hover { border-color: #00adb5; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; background: #393e46; padding: 15px; border-radius: 5px; }
        .stat-item { flex: 1; text-align: center; }
        .stat-item span { display: block; font-size: 0.8em; color: #aaa; }
        .stat-item b { font-size: 1.2em; color: #00adb5; }
        #log { width: 100%; height: 200px; background: #000; color: #0f0; font-family: monospace; padding: 10px; border: none; border-radius: 4px; overflow-y: scroll; font-size: 12px; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
        button { background: #00adb5; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #008f95; }
    </style>
</head>
<body>

<div class="container">
    <h1>Editor de Índices (.ind)</h1>
    
    <div class="upload-section" id="dropZone">
        <p>Arrastra tu archivo <b>Graficos.ind</b> aquí o</p>
        <input type="file" id="fileInput" accept=".ind">
    </div>

    <div class="stats">
        <div class="stat-item"><span>Versión</span><b id="vNum">-</b></div>
        <div class="stat-item"><span>Gráficos Totales</span><b id="gCount">-</b></div>
        <div class="stat-item"><span>Estado</span><b id="statusText">Esperando archivo...</b></div>
    </div>

    <textarea id="log" readonly placeholder="Consola de salida..."></textarea>

    <div class="actions">
        <button id="btnDownload" disabled>Descargar Graficos.ini</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const log = document.getElementById('log');
    const btnDownload = document.getElementById('btnDownload');
    let iniContent = "";

    fileInput.addEventListener('change', handleFile);

    function addLog(msg) {
        log.value += `> ${msg}\n`;
        log.scrollTop = log.scrollHeight;
    }

    async function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        addLog(`Cargando: ${file.name} (${file.size} bytes)`);
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 0;

        try {
            // Leer Cabecera (4 bytes Version, 4 bytes Count)
            const version = view.getInt32(offset, true); offset += 4;
            const grhCount = view.getInt32(offset, true); offset += 4;

            document.getElementById('vNum').innerText = version;
            document.getElementById('gCount').innerText = grhCount;
            document.getElementById('statusText').innerText = "Procesando...";

            iniContent = `[INIT]\nNumGrh=${grhCount}\nVersion=${version}\n\n[Graphics]\n`;
            
            let processed = 0;

            // Bucle de lectura según estructura AO
            while (offset < buffer.byteLength) {
                // Verificar si quedan bytes suficientes para el índice (4 bytes)
                if (offset + 4 > buffer.byteLength) break;
                
                const grhIndex = view.getInt32(offset, true); offset += 4;
                
                // Si el índice es 0 o menor, suele ser el fin del archivo estructurado
                if (grhIndex <= 0) break;

                const numFrames = view.getInt32(offset, true); offset += 4;

                if (numFrames === 1) {
                    const fileNum = view.getInt32(offset, true); offset += 4;
                    const sX = view.getInt32(offset, true); offset += 4;
                    const sY = view.getInt32(offset, true); offset += 4;
                    const width = view.getInt32(offset, true); offset += 4;
                    const height = view.getInt32(offset, true); offset += 4;

                    iniContent += `Grh${grhIndex}=1-${fileNum}-${sX}-${sY}-${width}-${height}\n`;
                    
                    // Validación específica solicitada
                    if (grhIndex === 32761) {
                        addLog(`¡Gráfico 32761 encontrado! (FileNum: ${fileNum})`);
                    }
                } else {
                    let frames = [];
                    for (let i = 0; i < numFrames; i++) {
                        frames.push(view.getInt32(offset, true));
                        offset += 4;
                    }
                    const speed = view.getFloat32(offset, true).toFixed(2);
                    offset += 4;
                    iniContent += `Grh${grhIndex}=${numFrames}-${frames.join('-')}-${speed}\n`;
                }
                
                processed++;
                if (processed % 1000 === 0) {
                    addLog(`Procesados ${processed} registros...`);
                }
            }

            document.getElementById('statusText').innerText = "Completado";
            addLog(`Lectura finalizada. ${processed} gráficos extraídos.`);
            btnDownload.disabled = false;

        } catch (err) {
            addLog(`ERROR: Estructura de archivo no válida o corrupta.`);
            console.error(err);
        }
    }

    btnDownload.onclick = () => {
        const blob = new Blob([iniContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Graficos.ini";
        a.click();
        URL.revokeObjectURL(url);
    };
</script>

</body>
</html>
