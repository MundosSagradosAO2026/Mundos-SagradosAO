<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundos Sagrados - Argentum Online</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { cursor: default; }

        body {
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('mapa_ao.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #fireCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5; 
        }

        /* --- HEADER --- */
        header {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logoHeader {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .header-title {
            color: #FFD700;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            transition: 0.3s;
            cursor: pointer;
        }

        nav ul li a:hover {
            color: #FFD700;
            text-shadow: 0 0 15px #FFD700;
        }

        /* --- CONTENIDO CENTRAL --- */
        .main-content {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 0;
        }

        #logoCentral {
            width: 280px;
            height: 280px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2));
            margin-bottom: 20px;
        }

        .main-title-big {
            font-size: 65px;
            color: #FFD700;
            margin: 10px 0;
            text-shadow: 2px 2px 10px #000;
        }

        .beta-text {
            font-size: 22px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 35px;
            border-radius: 50px;
            border: 1px solid #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* --- NPC --- */
        #npc-container {
            position: fixed;
            bottom: 180px;
            left: -100px;
            width: 64px;
            height: 64px;
            z-index: 8;
            animation: walk-across 22s linear infinite;
        }

        #npc {
            width: 64px;
            height: 64px;
            background: url('npc_sprite.png') no-repeat;
            animation: sprite-animation 0.8s steps(4) infinite;
        }

        @keyframes walk-across {
            0% { left: -100px; transform: scaleX(1); }
            48% { transform: scaleX(1); }
            50% { left: 110%; transform: scaleX(-1); }
            98% { transform: scaleX(-1); }
            100% { left: -100px; transform: scaleX(1); }
        }

        @keyframes sprite-animation {
            from { background-position: 0px; }
            to { background-position: -256px; }
        }

        /* --- MUSICA --- */
        .music-controls {
            position: fixed;
            bottom: 120px;
            right: 30px;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #FFD700;
            text-align: center;
        }

        .music-btn { font-size: 22px; background: none; border: none; color: #FFD700; cursor: pointer; }
        .volume-slider { width: 80px; accent-color: #FFD700; cursor: pointer; }

        /* --- FOOTER (Línea más fina y suave) --- */
        footer {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 45px 20px;
            background: #000;
            color: #FFD700; 
            font-weight: bold;
            font-size: 15px;
            border-top: 1px solid rgba(255, 215, 0, 0.4); /* LÍNEA FINA Y SUTIL */
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<header>
    <div class="header-left">
        <img id="logoHeader" src="logo.png" alt="Mundos Sagrados">
        <span class="header-title">Mundos Sagrados AO</span>
    </div>
    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Trailer</a></li>
            <li><a href="#">Galería</a></li>
            <li><a href="#">Discord</a></li>
            <li><a href="#">Wiki</a></li>
        </ul>
    </nav>
</header>

<div id="npc-container">
    <div id="npc"></div>
</div>

<div class="main-content">
    <img id="logoCentral" src="logo.png" alt="Logo Central Mundos Sagrados">
    <h1 class="main-title-big">MUNDOS SAGRADOS</h1>
    <div class="beta-text" id="countdown"></div>
</div>

<div class="music-controls">
    <button id="musicToggle" class="music-btn">🔊</button><br>
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<audio id="bgMusic" loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== MUSICA ===== */
const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");
const volumeSlider = document.getElementById("volumeControl");
let isPlaying = false;

window.addEventListener("load", () => {
    music.volume = 0.5;
    document.addEventListener("click", () => {
        if (!isPlaying) { music.play().catch(() => {}); isPlaying = true; }
    }, { once: true });
});

toggleBtn.addEventListener("click", () => {
    if(isPlaying){ music.pause(); toggleBtn.textContent = "🔇"; } 
    else { music.play(); toggleBtn.textContent = "🔊"; }
    isPlaying = !isPlaying;
});

volumeSlider.addEventListener("input", () => { music.volume = volumeSlider.value; });

/* ===== CONTADOR FECHA FIJA ===== */
function updateCountdown() {
    const countdown = document.getElementById("countdown");
    const targetDate = new Date(2028, 2, 1, 0, 0, 0).getTime();
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
        countdown.innerHTML = "¡LA BETA HA COMENZADO!";
        return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    countdown.innerHTML = `Versión beta en ${days}d ${hours}h ${minutes}m ${seconds}s`;
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* ===== FUEGO DESDE EL FOOTER ===== */
const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");
let footerElement = document.querySelector('footer');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let sparks = [];
class Spark {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = footerElement.getBoundingClientRect().top; 
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * 1.2 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.opacity = 1;
        this.maxLife = Math.random() * 100 + 50;
        this.life = 0;
    }
    update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.life++;
        this.opacity = 1 - (this.life / this.maxLife);
    }
    draw() {
        ctx.fillStyle = `rgba(255, ${160 + Math.random() * 40}, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (sparks.length < 35) sparks.push(new Spark());
    sparks.forEach((spark, index) => {
        spark.update();
        spark.draw();
        if (spark.opacity <= 0) sparks.splice(index, 1);
    });
}
animate();
</script>

</body>
</html>
