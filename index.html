<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recursos Amnerys AO</title>

<style>
body{
    margin:0;
    font-family: Consolas;
    background:#0b0b0b;
    color:#00ff9c;
}

/* VISTAS */
.view{ display:none; height:100vh; flex-direction:column; }
.active{ display:flex; }

/* MENU */
.menu{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:20px;
    height:100vh;
}

.menu h1{
    color:#00ffcc;
    text-shadow:0 0 15px #00ffcc;
}

/* HEADER */
.header{
    background:#111;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    border-bottom:1px solid #222;
}

/* BOTONES */
button{
    background:#1e1e1e;
    border:1px solid #333;
    color:#00ff9c;
    padding:10px 20px;
    cursor:pointer;
}

button:hover{
    background:#00adb5;
    color:#000;
}

/* PANEL */
.panel{
    flex:1;
    background:#000;
    padding:10px;
    overflow:auto;
    white-space:pre;
}

/* TEXTAREA */
textarea{
    flex:1;
    background:#000;
    color:#00ff9c;
    border:none;
    padding:10px;
}
</style>
</head>

<body>

<!-- MENU PRINCIPAL -->
<div id="main" class="view active menu">
    <h1>RECURSOS AMNERYS AO</h1>

    <button onclick="show('menuMap')">📂 Mapas (MAP / INF / DAT)</button>
    <button onclick="show('menuInd')">🖼️ Graficos.ind</button>
</div>

<!-- MENU MAPAS -->
<div id="menuMap" class="view">
    <div class="header">
        <button onclick="show('main')">← Volver</button>

        <button onclick="mapInput.click()">Cargar MAP</button>
        <button onclick="infInput.click()">Cargar INF</button>
        <button onclick="datInput.click()">Cargar DAT</button>

        <input type="file" id="mapInput" hidden>
        <input type="file" id="infInput" hidden>
        <input type="file" id="datInput" hidden>
    </div>

    <div id="mapPanel" class="panel"></div>
</div>

<!-- MENU IND -->
<div id="menuInd" class="view">
    <div class="header">
        <button onclick="show('main')">← Volver</button>

        <button onclick="loadInd.click()">Cargar IND</button>
        <button onclick="saveIni()">Exportar INI</button>
        <button onclick="saveInd()">Exportar IND</button>

        <input type="file" id="loadInd" hidden>
    </div>

    <textarea id="editor"></textarea>
</div>

<script>
function show(v){
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    document.getElementById(v).classList.add('active');
}

//////////////////////////////////////////////////
// MAP
//////////////////////////////////////////////////
mapInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);

    let out = "MAPA\n\n";

    let offset = 272;
    let count = 0;

    for(let y=0;y<100;y++){
        for(let x=0;x<100;x++){

            if(offset+3>buf.byteLength) break;

            let block = view.getUint8(offset);
            let grh = view.getUint16(offset+1,true);

            if(count<500)
                out += `[${x},${y}] Block:${block} GRH:${grh}\n`;

            offset+=3;
            count++;
        }
    }

    out += "\nTotal tiles: "+count;
    mapPanel.innerText = out;
};

//////////////////////////////////////////////////
// INF
//////////////////////////////////////////////////
infInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);

    let out = "INF EVENTOS\n\n";

    let offset = 0;

    while(offset < buf.byteLength-6){

        if(view.getUint8(offset)==1 && view.getUint8(offset+1)==2){

            const tipo = view.getUint8(offset+3);
            const id   = view.getUint8(offset+5);

            let hasData = false;

            for(let i=0;i<10;i++){
                if(view.getUint8(offset+6+i)!==0) hasData = true;
            }

            if(hasData){
                out += `Tile ${id} | Tipo ${tipo}\n`;
            }

            offset+=6;
        }else offset++;
    }

    mapPanel.innerText = out;
};

//////////////////////////////////////////////////
// DAT
//////////////////////////////////////////////////
datInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();

    let text = new TextDecoder("latin1").decode(buf);

    let out = "CONFIG MAPA\n\n";

    text.split(/\r?\n/).forEach(l=>{
        if(l.trim()) out+=l+"\n";
    });

    mapPanel.innerText = out;
};

//////////////////////////////////////////////////
// IND
//////////////////////////////////////////////////
loadInd.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let offset=0;
    const ver=view.getInt32(offset,true); offset+=4;
    const total=view.getInt32(offset,true); offset+=4;

    let text=`[INIT]\nNumGrh=${total}\nVersion=${ver}\n\n[Graphics]\n`;

    while(offset<buffer.byteLength){
        const index=view.getInt32(offset,true); offset+=4;
        if(index<=0) break;

        const frames=view.getInt16(offset,true); offset+=2;

        if(frames===1){
            const f=view.getInt32(offset,true); offset+=4;
            const x=view.getInt16(offset,true); offset+=2;
            const y=view.getInt16(offset,true); offset+=2;
            const w=view.getInt16(offset,true); offset+=2;
            const h=view.getInt16(offset,true); offset+=2;

            text+=`Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
        }else{
            let ids=[];
            for(let i=0;i<frames;i++){
                ids.push(view.getInt32(offset,true));
                offset+=4;
            }
            const spd=view.getFloat32(offset,true); offset+=4;
            text+=`Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
        }
    }

    editor.value=text;
};

function saveIni(){
    const blob=new Blob([editor.value],{type:"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Graficos.ini";
    a.click();
}

//////////////////////////////////////////////////
// NUEVO: EXPORTAR IND
//////////////////////////////////////////////////
function saveInd(){

    const text = editor.value.split(/\r?\n/);

    let version = 1;
    let numGrh = 0;
    let grhData = [];

    for(let line of text){

        line = line.trim();
        if(!line) continue;

        if(line.startsWith("Version=")){
            version = parseInt(line.split("=")[1]);
        }

        if(line.startsWith("NumGrh=")){
            numGrh = parseInt(line.split("=")[1]);
        }

        if(line.startsWith("Grh")){
            const [left, right] = line.split("=");

            const index = parseInt(left.replace("Grh",""));
            const parts = right.split("-");

            const frames = parseInt(parts[0]);

            if(frames === 1){
                grhData.push({
                    index,
                    frames,
                    file: parseInt(parts[1]),
                    x: parseInt(parts[2]),
                    y: parseInt(parts[3]),
                    w: parseInt(parts[4]),
                    h: parseInt(parts[5])
                });
            }else{
                let ids = [];

                for(let i=1;i<=frames;i++){
                    ids.push(parseInt(parts[i]));
                }

                const speed = parseFloat(parts[frames+1]);

                grhData.push({
                    index,
                    frames,
                    ids,
                    speed
                });
            }
        }
    }

    let size = 8;

    for(let g of grhData){
        size += 4 + 2;

        if(g.frames === 1){
            size += 4 + 2 + 2 + 2 + 2;
        }else{
            size += g.frames * 4 + 4;
        }
    }

    const buffer = new ArrayBuffer(size);
    const view = new DataView(buffer);

    let offset = 0;

    view.setInt32(offset, version, true); offset += 4;
    view.setInt32(offset, numGrh, true); offset += 4;

    for(let g of grhData){

        view.setInt32(offset, g.index, true); offset += 4;
        view.setInt16(offset, g.frames, true); offset += 2;

        if(g.frames === 1){
            view.setInt32(offset, g.file, true); offset += 4;
            view.setInt16(offset, g.x, true); offset += 2;
            view.setInt16(offset, g.y, true); offset += 2;
            view.setInt16(offset, g.w, true); offset += 2;
            view.setInt16(offset, g.h, true); offset += 2;
        }else{
            for(let id of g.ids){
                view.setInt32(offset, id, true); offset += 4;
            }
            view.setFloat32(offset, g.speed, true); offset += 4;
        }
    }

    const blob = new Blob([buffer], {type: "application/octet-stream"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "graficos.ind";
    a.click();
}
</script>

</body>
</html>
