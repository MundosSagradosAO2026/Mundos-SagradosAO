<!-- ====== FUENTE CINZEL ====== -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0a0a0f;
    color:white;
    font-family:'Cinzel', serif;
    text-align:center;
}

/* ===== CONTROLES MUSICA ===== */
.music-controls{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.6);
    padding:15px;
    border-radius:12px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(255,215,0,0.4);
}

.music-btn{
    font-size:22px;
    cursor:pointer;
    background:none;
    border:none;
    color:gold;
}

.volume-slider{
    width:100px;
    margin-top:10px;
}

/* ===== FOOTER ===== */
footer{
    margin-top:80px;
    padding:20px;
    font-size:14px;
    color:rgba(255,255,255,0.6);
    border-top:1px solid rgba(255,215,0,0.3);
}
</style>

<!-- ====== AUDIO ====== -->
<audio id="bgMusic" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- ====== CONTROLES ====== -->
<div class="music-controls">
    <button id="musicToggle" class="music-btn">🔊</button>
    <br>
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<!-- ====== VIDEO EJEMPLO ====== -->
<!-- Si tenés varios videos, funciona igual -->
<video id="mainVideo" width="600" controls style="margin-top:100px;">
    <source src="video.mp4" type="video/mp4">
</video>

<!-- ====== FOOTER ====== -->
<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<script>
const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");
const volumeSlider = document.getElementById("volumeControl");
const video = document.getElementById("mainVideo");

let isPlaying = false;

/* ===== ACTIVAR / DESACTIVAR MUSICA ===== */
toggleBtn.addEventListener("click", () => {
    if(isPlaying){
        music.pause();
        toggleBtn.textContent = "🔇";
    }else{
        music.play();
        toggleBtn.textContent = "🔊";
    }
    isPlaying = !isPlaying;
});

/* ===== CONTROL VOLUMEN ===== */
volumeSlider.addEventListener("input", () => {
    music.volume = volumeSlider.value;
});

/* ===== SI EL VIDEO SE REPRODUCE → PAUSA MUSICA ===== */
video.addEventListener("play", () => {
    if(isPlaying){
        music.pause();
    }
});

/* ===== SI EL VIDEO SE PAUSA → CONTINUA MUSICA ===== */
video.addEventListener("pause", () => {
    if(isPlaying){
        music.play();
    }
});
</script>
