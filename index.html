<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundos Sagrados - Argentum Online</title>

    <style>
        body {
            margin: 0;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        #fireCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        header, .container, footer {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        .logo img {
            max-width: 300px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .bloque {
            text-align: center;
        }

        .bloque img {
            max-width: 300px;
        }

        .video {
            width: 300px;
            height: 200px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.6);
        }

        /* BOTÓN DE MÚSICA */
        #musicBtn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 12px 18px;
            background: linear-gradient(145deg, #8b0000, #550000);
            color: white;
            border: 1px solid #aa0000;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
            transition: all 0.3s ease;
        }

        #musicBtn:hover {
            box-shadow: 0 0 20px rgba(255,0,0,0.8);
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<header>
    <div class="logo">
        <img src="logo.png" alt="Argentum Online" title="Argentum Online">
    </div>
</header>

<section class="container">
    
    <div class="bloque">
        <iframe class="video" 
        src="https://www.youtube.com/embed/xYVDuS3nDoo" 
        frameborder="0" 
        allowfullscreen></iframe>
        <p>Video</p>
    </div> 
    
    <div class="bloque">
        <img src="imagen1.png" alt="Imagen">
        <p>Texto de la imagen</p>
    </div> 
        
</section>

<footer>
    <p>Argentum Online 2024</p>
</footer>

<!-- BOTÓN MÚSICA -->
<button id="musicBtn">🔊 Activar Música</button>

<audio id="bgMusic" loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<script>
/* ================= FIRE EFFECT ================= */

const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let sparks = [];

class Spark {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 4 + 1;
        this.speedY = Math.random() * 2 + 1;
        this.opacity = Math.random();
    }

    update() {
        this.y -= this.speedY;
        this.opacity -= 0.01;
    }

    draw() {
        ctx.fillStyle = `rgba(255, ${Math.random()*150}, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sparks.length < 150) {
        sparks.push(new Spark());
    }

    sparks.forEach((spark, index) => {
        spark.update();
        spark.draw();
        if (spark.opacity <= 0) {
            sparks.splice(index, 1);
        }
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

/* ================= MUSIC SYSTEM ================= */

const music = document.getElementById("bgMusic");
const btn = document.getElementById("musicBtn");

music.volume = 0.3;

function fadeIn(audio, duration = 2000) {
    audio.volume = 0;
    audio.play();
    let step = 0.02;
    let interval = duration / (1/step);
    let fade = setInterval(() => {
        if (audio.volume < 0.3) {
            audio.volume = Math.min(audio.volume + step, 0.3);
        } else {
            clearInterval(fade);
        }
    }, interval);
}

function updateButton() {
    if (!music.paused) {
        btn.textContent = "🔇 Desactivar Música";
    } else {
        btn.textContent = "🔊 Activar Música";
    }
}

btn.addEventListener("click", () => {
    if (music.paused) {
        fadeIn(music);
        localStorage.setItem("musicActive", "true");
    } else {
        music.pause();
        localStorage.setItem("musicActive", "false");
    }
    updateButton();
});

window.addEventListener("load", () => {
    if (localStorage.getItem("musicActive") === "true") {
        fadeIn(music);
    }
    updateButton();
});
</script>

</body>
</html>
