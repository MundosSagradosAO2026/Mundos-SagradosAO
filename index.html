<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundos Sagrados - Argentum Online</title>

    <link rel="shortcut icon" href="MundosSagrados.ico" type="image/x-icon">
    <link rel="icon" href="MundosSagrados.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #000;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* FUEGO - Ajustado para que no tape el contenido */
        #fireCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5; 
        }

        /* LOGO CENTRADO 500x500 */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        #logoImg {
            width: 500px;
            height: 500px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
        }

        .main-content {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -20px;
        }

        .main-title {
            text-align: center;
            font-size: 60px;
            font-weight: 900;
            color: #FFD700; 
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), -2px 2px 0 #000;
        }

        .beta-text {
            text-align: center;
            font-size: 24px;
            color: #fff;
            margin-top: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        /* CONTROLES MÚSICA */
        .music-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #FFD700;
        }

        .music-btn {
            font-size: 20px;
            background: none;
            border: none;
            color: #FFD700;
            cursor: pointer;
        }

        .volume-slider { width: 80px; accent-color: #FFD700; }

        /* FOOTER CON LÍNEA DORADA */
        footer {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 50px 20px;
            background: #000;
            color: #FFD700; 
            font-weight: bold;
            font-size: 15px;
            border-top: 3px solid #FFD700; /* La línea de donde sale el fuego */
            box-shadow: 0 -15px 30px rgba(255, 69, 0, 0.2);
        }

    </style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<div class="music-controls">
    <button id="musicToggle" class="music-btn">🔊</button><br>
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<header>
    <img id="logoImg" src="logo.png" alt="Mundos Sagrados">
</header>

<div class="main-content">
    <div class="main-title">Mundos Sagrados AO</div>
    <div class="beta-text" id="countdown"></div>
</div>

<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<audio id="bgMusic" loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== MUSICA ===== */
const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");
const volumeSlider = document.getElementById("volumeControl");
let isPlaying = false;

window.addEventListener("load", () => {
    music.volume = 0.5;
    document.addEventListener("click", () => {
        if (!isPlaying) { music.play().catch(() => {}); isPlaying = true; }
    }, { once: true });
});

toggleBtn.addEventListener("click", () => {
    if(isPlaying){ music.pause(); toggleBtn.textContent = "🔇"; } 
    else { music.play(); toggleBtn.textContent = "🔊"; }
    isPlaying = !isPlaying;
});

volumeSlider.addEventListener("input", () => { music.volume = volumeSlider.value; });

/* ===== CONTADOR FECHA FIJA ===== */
function updateCountdown() {
    const countdown = document.getElementById("countdown");
    const targetDate = new Date(2028, 2, 1, 0, 0, 0).getTime();
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
        countdown.innerHTML = "¡LA BETA HA COMENZADO!";
        return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    countdown.innerHTML = `Versión beta en ${days}d ${hours}h ${minutes}m ${seconds}s`;
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* ===== FUEGO CONTROLADO (Desde la línea del footer) ===== */
const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");
let footerElement = document.querySelector('footer');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let sparks = [];

class Spark {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * canvas.width;
        // El fuego nace exactamente en el tope del footer
        this.y = footerElement.getBoundingClientRect().top; 
        this.size = Math.random() * 2 + 0.5; // Más pequeñas para menos intensidad
        this.speedY = Math.random() * 1.5 + 0.5; // Subida lenta
        this.speedX = (Math.random() - 0.5) * 0.5; // Movimiento lateral mínimo
        this.opacity = 1;
        this.maxLife = Math.random() * 100 + 50;
        this.life = 0;
    }

    update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.life++;
        this.opacity = 1 - (this.life / this.maxLife);
    }

    draw() {
        ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100}, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Cantidad reducida para "menos intensidad"
    if (sparks.length < 50) { 
        sparks.push(new Spark());
    }

    sparks.forEach((spark, index) => {
        spark.update();
        spark.draw();
        if (spark.opacity <= 0 || spark.y < 0) {
            sparks.splice(index, 1);
        }
    });
}
animate();
</script>

</body>
</html>
