<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Extractor TSao PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<style>
body{
    background:#0b0b0b;
    color:#FFD700;
    font-family: monospace;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
}

#log{
    background:#000;
    color:#00ff00;
    height:150px;
    overflow:auto;
    padding:10px;
    margin-top:10px;
    font-size:12px;
}

#images{
    margin-top:20px;
    display:grid;
    grid-template-columns: repeat(auto-fill, 100px);
    gap:10px;
    justify-content:center;
}

img{
    width:100px;
    border:1px solid #333;
}
</style>
</head>

<body>

<div class="container">
<h2>Extractor Grh.tsao</h2>

<input type="file" id="fileInput">
<br><br>
<button onclick="start()">EXTRAER</button>

<div id="log"></div>
<div id="images"></div>

</div>

<script>

const logDiv = document.getElementById("log");
const imgDiv = document.getElementById("images");

function log(t){
    logDiv.innerHTML += "> " + t + "<br>";
    logDiv.scrollTop = logDiv.scrollHeight;
}

// clave VB6
const keyStr = "quierovalecuatro";
const key = new Uint8Array([...keyStr].map(c=>c.charCodeAt(0)));

function readString(bytes, offset, len){
    let s="";
    for(let i=0;i<len;i++){
        if(bytes[offset+i]===0) break;
        s+=String.fromCharCode(bytes[offset+i]);
    }
    return s.trim();
}

async function start(){

    imgDiv.innerHTML="";
    logDiv.innerHTML="";

    const file = document.getElementById("fileInput").files[0];
    if(!file) return alert("Seleccioná archivo");

    log("Cargando archivo...");

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);

    const view = new DataView(buffer);

    // HEADER
    let numFiles = view.getUint16(4, true);

    // fallback offset VB6
    if(numFiles<=0 || numFiles>50000){
        numFiles = view.getUint16(12, true);
        log("Header corregido");
    }

    log("Archivos: " + numFiles);

    let offset = 6;

    if(numFiles>50000) offset = 14;

    let files = [];

    for(let i=0;i<numFiles;i++){

        let start = view.getUint32(offset, true);
        let size = view.getUint32(offset+4, true);
        let name = readString(bytes, offset+8, 32);
        let usize = view.getUint32(offset+40, true);

        files.push({start,size,name,usize});

        offset += 44;
    }

    log("Index leído");

    let ok = 0;
    let fail = 0;

    for(let i=0;i<files.length;i++){

        let f = files[i];

        try{

            let data = bytes.slice(f.start, f.start + f.size);

            // XOR CORRECTO (SOLO PRIMEROS BYTES)
            for(let j=0;j<key.length && j<data.length;j++){
                data[j] ^= key[j];
            }

            let decompressed = pako.inflate(data);

            let blob = new Blob([decompressed], {type:"image/png"});
            let url = URL.createObjectURL(blob);

            let img = document.createElement("img");
            img.src = url;
            img.title = f.name;

            imgDiv.appendChild(img);

            ok++;

        }catch(e){
            fail++;
            if(fail < 30){
                log("Error en " + f.name);
            }
        }

        if(i % 50 === 0){
            await new Promise(r=>setTimeout(r,1));
        }
    }

    log("OK: " + ok);
    log("Errores: " + fail);
    log("FIN");

}

</script>

</body>
</html>
