<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundos Sagrados - Argentum Online</title>

<link rel="icon" type="image/x-icon" href="MundosSagrados.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: #000;
    font-family: 'Cinzel', serif;
    overflow-x: hidden;
}

/* FUEGO */
#fireCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

/* HEADER */
header {
    position: relative;
    z-index: 1;
    padding: 30px 40px;
}

#logoImg {
    max-width: 180px;
    float: left;
}

.main-title {
    text-align: center;
    font-size: 60px;
    font-weight: 900;
    color: #FFD700;
    text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    margin-top: 40px;
}

.beta-text {
    text-align: center;
    font-size: 26px;
    color: #fff;
    text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    margin-top: 20px;
}

/* MUSICA */
.music-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2;
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 15px rgba(255,140,0,0.5);
}

.music-btn {
    font-size: 22px;
    background: none;
    border: none;
    color: orange;
    cursor: pointer;
}

.volume-slider {
    width: 100px;
    margin-top: 6px;
}

/* FOOTER */
footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    margin-top: 100px;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    border-top: 1px solid rgba(255,140,0,0.3);
    color: white;
}

</style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<div class="music-controls">
    <button id="musicToggle" class="music-btn">🔊</button><br>
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<header>
    <img id="logoImg" src="logo.png" alt="Mundos Sagrados">
</header>

<div class="main-title">Mundos Sagrados AO</div>
<div class="beta-text" id="countdown"></div>

<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<audio id="bgMusic" loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<!-- ================= SCRIPTS ================= -->

<script>

/* ===== MUSICA ===== */

const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");
const volumeSlider = document.getElementById("volumeControl");

let isPlaying = false;

window.addEventListener("load", () => {
    music.volume = 0.5;

    document.addEventListener("click", () => {
        if (!isPlaying) {
            music.play();
            isPlaying = true;
        }
    }, { once: true });
});

toggleBtn.addEventListener("click", () => {
    if(isPlaying){
        music.pause();
        toggleBtn.textContent = "🔇";
    } else {
        music.play();
        toggleBtn.textContent = "🔊";
    }
    isPlaying = !isPlaying;
});

volumeSlider.addEventListener("input", () => {
    music.volume = volumeSlider.value;
});

</script>

<script>

/* ===== CONTADOR 2 AÑOS TIEMPO REAL ===== */

document.addEventListener("DOMContentLoaded", function() {

    const countdown = document.getElementById("countdown");

    const targetDate = new Date();
    targetDate.setFullYear(targetDate.getFullYear() + 2);

    function updateCountdown() {

        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
            countdown.innerHTML = "¡LA BETA HA COMENZADO!";
            return;
        }

        const totalSeconds = Math.floor(diff / 1000);

        const years = Math.floor(totalSeconds / (365 * 24 * 60 * 60));
        const days = Math.floor((totalSeconds % (365 * 24 * 60 * 60)) / (24 * 60 * 60));
        const hours = Math.floor((totalSeconds % (24 * 60 * 60)) / (60 * 60));
        const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
        const seconds = totalSeconds % 60;

        countdown.innerHTML =
            "Versión beta en " +
            years + " año(s), " +
            days + " días, " +
            hours + " horas, " +
            minutes + " minutos y " +
            seconds + " segundos";
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

});

</script>

<script>

/* ===== FUEGO SIMPLE ===== */

const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let sparks = [];

class Spark {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 2 + 1;
        this.opacity = Math.random();
    }

    update() {
        this.y -= this.speedY;
        this.opacity -= 0.01;
    }

    draw() {
        ctx.fillStyle = `rgba(255, ${Math.random()*200}, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sparks.length < 80) sparks.push(new Spark());

    sparks.forEach((spark, index) => {
        spark.update();
        spark.draw();
        if (spark.opacity <= 0) sparks.splice(index, 1);
    });
}

animate();

</script>

</body>
</html>
