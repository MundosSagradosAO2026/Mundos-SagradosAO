<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Amnerys - Suite de Desarrollo AO</title>

<style>
body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
.view { display: none; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
.active { display: flex !important; }
#mainMenu { align-items: center; justify-content: center; gap: 20px; }
.logo-title { font-size: 3em; text-shadow: 0 0 15px #00ff00; margin-bottom: 20px; color: #fff; }
.grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 90%; max-width: 1000px; }
.card { background: #1e1e1e; border: 2px solid #333; padding: 30px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
.card:hover { border-color: #00adb5; transform: translateY(-5px); background: #252525; }
.header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
.btn { padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; }
.btn-back { background: #ff4d4d; color: white; }
.btn-action { background: #00adb5; color: white; }
.btn-secondary { background: #444; color: white; }
.status { color: #888; font-size: 12px; margin-left: auto; }
#editor { flex: 1; background: #000; color: #0f0; border: 1px solid #333; padding: 15px; font-size: 14px; resize: none; }
#mapDebug { flex: 1; background: #000; color: #00ff00; padding: 15px; border: 1px solid #333; overflow-y: auto; font-size: 12px; white-space: pre; }
</style>
</head>

<body>

<div id="mainMenu" class="view active">
    <div class="logo-title">AMNERYS SUITE</div>
    <div class="grid-buttons">
        <div class="card" onclick="showView('editorContainer')">Editor .IND</div>
        <div class="card" onclick="showView('mapScannerContainer')">Analizador MAP / INF / DAT</div>
    </div>
</div>

<div id="editorContainer" class="view">
    <div class="header">
        <button class="btn btn-back" onclick="showView('mainMenu')">← Menú</button>
        <strong>Indexador Graficos.ind</strong>
        <input type="file" id="loadInd" style="display:none">
        <button class="btn btn-secondary" onclick="loadInd.click()">Cargar .IND</button>
        <button class="btn btn-secondary" onclick="saveIni()">Exportar .INI</button>
        <div class="status">IND intacto</div>
    </div>
    <textarea id="editor"></textarea>
</div>

<div id="mapScannerContainer" class="view">
    <div class="header">
        <button class="btn btn-back" onclick="showView('mainMenu')">← Menú</button>
        <input type="file" id="mapInput" style="display:none">
        <input type="file" id="infInput" style="display:none">
        <input type="file" id="datInput" style="display:none">
        <button class="btn btn-action" onclick="mapInput.click()">Cargar .MAP</button>
        <button class="btn btn-secondary" onclick="infInput.click()">Cargar .INF</button>
        <button class="btn btn-secondary" onclick="datInput.click()">Cargar .DAT</button>
        <div class="status" id="statusMap">Esperando archivo...</div>
    </div>
    <div id="mapDebug"></div>
</div>

<script>
function showView(v){
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    document.getElementById(v).classList.add('active');
}

////////////////////////////////////////////////////////////
// MAP
////////////////////////////////////////////////////////////
mapInput.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let output = `MAP: ${file.name}\n\n`;

    const START = 272;
    const SIZE = 3;
    const W = 100;
    const H = 100;

    let offset = START;
    let count = 0;

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){
            if(offset+3>buffer.byteLength) break;

            const block = view.getUint8(offset);
            const grh = view.getUint16(offset+1,true);

            if(count<500){
                output += `${x},${y} | ${block} | ${grh}\n`;
            }

            offset+=SIZE;
            count++;
        }
    }

    output += `\nTotal tiles: ${count}`;
    mapDebug.innerText = output;
    statusMap.innerText = "MAP OK";
};

////////////////////////////////////////////////////////////
// INF (DECODIFICADO)
////////////////////////////////////////////////////////////
infInput.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let output = `INF: ${file.name}\n\n`;

    let offset = 0;
    let count = 0;

    while(offset < buffer.byteLength-6){

        if(view.getUint8(offset)===1 && view.getUint8(offset+1)===2){

            const tipo = view.getUint16(offset+2,true);
            const id = view.getUint16(offset+4,true);

            output += `Bloque ${count}\n`;
            output += `Offset: 0x${offset.toString(16)}\n`;
            output += `Tipo: ${tipo} | ID: ${id}\n`;

            let data=[];
            for(let i=0;i<16;i++){
                if(offset+6+i>=buffer.byteLength) break;
                data.push(view.getUint8(offset+6+i).toString(16).padStart(2,'0'));
            }

            output += `Data: ${data.join(' ')}\n\n`;

            count++;
            offset+=6;
        }else{
            offset++;
        }
    }

    output += `TOTAL BLOQUES: ${count}`;
    mapDebug.innerText = output;
    statusMap.innerText = "INF OK";
};

////////////////////////////////////////////////////////////
// DAT (NUEVO)
////////////////////////////////////////////////////////////
datInput.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let output = `DAT: ${file.name}\n\n`;

    // Explorador inteligente
    for(let i=0;i<buffer.byteLength;i+=16){

        let hex="";
        let ascii="";

        for(let j=0;j<16;j++){
            if(i+j<buffer.byteLength){
                let b=view.getUint8(i+j);
                hex+=b.toString(16).padStart(2,'0')+" ";
                ascii+=(b>=32&&b<=126)?String.fromCharCode(b):".";
            }
        }

        output += `${i.toString(16).padStart(4,'0')} | ${hex.padEnd(48)} | ${ascii}\n`;
    }

    mapDebug.innerText = output;
    statusMap.innerText = "DAT ANALIZADO";
};

////////////////////////////////////////////////////////////
// IND (NO TOCADO)
////////////////////////////////////////////////////////////
loadInd.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let offset=0;
    const ver=view.getInt32(offset,true); offset+=4;
    const total=view.getInt32(offset,true); offset+=4;

    let text=`[INIT]\nNumGrh=${total}\nVersion=${ver}\n\n[Graphics]\n`;

    while(offset<buffer.byteLength){
        const index=view.getInt32(offset,true); offset+=4;
        if(index<=0) break;

        const frames=view.getInt16(offset,true); offset+=2;

        if(frames===1){
            const f=view.getInt32(offset,true); offset+=4;
            const x=view.getInt16(offset,true); offset+=2;
            const y=view.getInt16(offset,true); offset+=2;
            const w=view.getInt16(offset,true); offset+=2;
            const h=view.getInt16(offset,true); offset+=2;

            text+=`Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
        }else{
            let ids=[];
            for(let i=0;i<frames;i++){
                ids.push(view.getInt32(offset,true));
                offset+=4;
            }
            const spd=view.getFloat32(offset,true); offset+=4;
            text+=`Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
        }
    }

    editor.value=text;
};

function saveIni(){
    const blob=new Blob([editor.value],{type:"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Graficos.ini";
    a.click();
}
</script>

</body>
</html>
