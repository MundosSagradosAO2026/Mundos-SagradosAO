<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys - Suite de Desarrollo AO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #mainMenu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .logo-title { font-size: 3em; text-shadow: 0 0 15px #00ff00; color: #fff; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 80% }
        .card { background: #1e1e1e; border: 2px solid #333; padding: 30px; border-radius: 12px; cursor: pointer; text-align: center; }
        .card:hover { border-color: #00adb5; background: #252525; }
        .view-container { display: none; flex-direction: column; height: 100vh; padding: 20px; }
        .header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        #editor { flex: 1; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; }
        .unpacker-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .side-panel { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .gallery { background: #000; border-radius: 8px; border: 1px solid #333; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .img-card { background: #111; border: 1px solid #444; padding: 5px; text-align: center; font-size: 10px; color: #eee; }
        .img-card img { max-width: 100px; height: auto; image-rendering: pixelated; background: #222; }
        .btn { padding: 10px 20px; cursor: pointer; font-weight: bold; border: none; border-radius: 4px; }
        .btn-ind { background: #00adb5; color: white; }
        .btn-back { background: #ff4d4d; color: white; }
        .status { color: #888; font-size: 12px; margin-left: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="logo-title">AMNERYS DESARROLLO</div>
        <div class="grid-buttons">
            <div class="card" onclick="showView('editorContainer')"><span>🖼️</span><h3>Editor Index</h3></div>
            <div class="card" onclick="showView('unpackerContainer')"><span>📦</span><h3>Unpacker TSAO</h3></div>
        </div>
    </div>

    <div id="editorContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">← Volver</button>
            <input type="file" id="loadInd" style="display:none">
            <button class="btn btn-ind" onclick="document.getElementById('loadInd').click()">Cargar .IND</button>
            <div class="status" id="status">Listo</div>
        </div>
        <textarea id="editor"></textarea>
    </div>

    <div id="unpackerContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">← Volver</button>
            <strong>Unpacker Estable</strong>
            <div class="status" id="unpackerStatus">Carga archivos</div>
        </div>
        <div class="unpacker-layout">
            <div class="side-panel">
                <label>Grh_path.tsao:</label><input type="file" id="filePaths">
                <label>Grh.tsao:</label><input type="file" id="fileData">
                <button class="btn btn-ind" id="btnRunUnpack">DESENCRIPTAR</button>
                <div id="logUnpack" style="background:#000; padding:10px; font-size:11px; height:150px; overflow-y:auto; border:1px solid #333; color:#0f0;"></div>
            </div>
            <div class="gallery" id="galleryBox"></div>
        </div>
    </div>

<script>
    function showView(id) {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('editorContainer').style.display = 'none';
        document.getElementById('unpackerContainer').style.display = 'none';
        if(id === 'mainMenu') document.getElementById('mainMenu').classList.remove('hidden');
        else document.getElementById(id).style.display = 'flex';
    }

    // Lógica Editor Index (Mantenida igual)
    const editor = document.getElementById('editor');
    document.getElementById('loadInd').onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 4; // Saltamos versión
        const total = view.getInt32(offset, true); offset += 4;
        let text = `[INIT]\nNumGrh=${total}\n\n[Graphics]\n`;
        for(let i=0; i<total; i++) {
            if(offset >= buffer.byteLength) break;
            const idx = view.getInt32(offset, true); offset += 4;
            const frames = view.getInt16(offset, true); offset += 2;
            if(frames === 1) {
                const f = view.getInt32(offset, true); offset += 4;
                const x = view.getInt16(offset, true); offset += 2;
                const y = view.getInt16(offset, true); offset += 2;
                const w = view.getInt16(offset, true); offset += 2;
                const h = view.getInt16(offset, true); offset += 2;
                text += `Grh${idx}=1-${f}-${x}-${y}-${w}-${h}\n`;
            } else {
                let ids = []; for(let j=0; j<frames; j++){ ids.push(view.getInt32(offset,true)); offset+=4; }
                offset += 4; // speed
                text += `Grh${idx}=${frames}-${ids.join('-')}-1\n`;
            }
        }
        editor.value = text;
    };

    // LÓGICA UNPACKER (LA QUE "EXPLOTABA")
    document.getElementById('btnRunUnpack').onclick = async () => {
        const pFile = document.getElementById('filePaths').files[0];
        const dFile = document.getElementById('fileData').files[0];
        const log = document.getElementById('logUnpack');
        const gall = document.getElementById('galleryBox');

        if (!pFile || !dFile) return alert("Faltan archivos.");

        log.innerHTML = "Analizando...<br>";
        gall.innerHTML = "";
        
        const pBuf = await pFile.arrayBuffer();
        const dBuf = await dFile.arrayBuffer();
        const pView = new DataView(pBuf);
        const dBytes = new Uint8Array(dBuf);
        
        const key = "quierovalecuatro";
        const datCM = key.split('').map(c => c.charCodeAt(0));
        
        // Saltamos la cabecera (en tus archivos parece ser de 13 bytes o empieza en 0)
        // Probamos offset 0 ya que los nombres se ven al inicio
        let offset = 0; 
        const recordSize = 44; // Nombre(32) + Start(4) + Size(4) + Uncomp(4)
        const numFiles = Math.floor(pBuf.byteLength / recordSize);

        log.innerHTML += `Archivos: ${numFiles}<br>`;

        for (let i = 0; i < numFiles; i++) {
            let currentOffset = i * recordSize;
            
            // 1. Obtener Nombre
            let nameBytes = new Uint8Array(pBuf, currentOffset, 32);
            let fName = new TextDecoder().decode(nameBytes).replace(/\0/g, '').trim();
            
            // 2. Obtener punteros
            const startPos = pView.getUint32(currentOffset + 32, true);
            const size = pView.getUint32(currentOffset + 36, true);
            
            if (size > 0 && startPos < dBytes.length) {
                try {
                    // 3. Extraer y Desencriptar XOR
                    let chunk = dBytes.slice(startPos, startPos + size);
                    for (let j = 0; j < chunk.length; j++) {
                        chunk[j] = chunk[j] ^ datCM[j % datCM.length];
                    }

                    // 4. Descomprimir Zlib
                    const unzipped = pako.inflate(chunk);
                    const url = URL.createObjectURL(new Blob([unzipped], {type:'image/png'}));

                    const div = document.createElement('div');
                    div.className = 'img-card';
                    div.innerHTML = `<img src="${url}"><br>${fName}`;
                    gall.appendChild(div);
                } catch (e) {
                    // Error en este gráfico, seguimos al siguiente
                }
            }

            // --- CRÍTICO: Evitar que la página explote ---
            if (i % 50 === 0) {
                log.innerHTML = `Procesado: ${i} / ${numFiles}`;
                await new Promise(r => setTimeout(r, 1)); // Esto libera el navegador para que no se congele
            }
        }
        log.innerHTML = "<strong>Extracción Finalizada.</strong>";
    };
</script>
</body>
</html>
