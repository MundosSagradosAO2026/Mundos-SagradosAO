<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extractor TSAO REAL</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body style="background:#111;color:#0f0;font-family:monospace">

<input type="file" id="file">
<div id="log"></div>
<div id="imgs"></div>

<script>
const log = t => document.getElementById("log").innerHTML += "> " + t + "<br>";

// clave XOR
const keyStr = "quierovalecuatro";
const key = new Uint8Array([...keyStr].map(c => c.charCodeAt(0)));

document.getElementById("file").onchange = async e => {

    let file = e.target.files[0];
    let buffer = await file.arrayBuffer();
    let dv = new DataView(buffer);
    let bytes = new Uint8Array(buffer);

    log("Archivo cargado");

    let offset = 0;

    // ===== FILEHEADER =====
    let totalSize = dv.getUint32(offset, true); offset += 4;
    let numFiles = dv.getUint16(offset, true); offset += 2;

    log("Archivos: " + numFiles);

    // sanity check
    if(numFiles <= 0 || numFiles > 50000){
        log("Header inválido, probando offset 12...");
        offset = 12;
        totalSize = dv.getUint32(offset, true); offset += 4;
        numFiles = dv.getUint16(offset, true); offset += 2;
    }

    let files = [];

    // ===== INFOHEADERS =====
    for(let i=0;i<numFiles;i++){

        let start = dv.getUint32(offset, true); offset+=4;
        let size = dv.getUint32(offset, true); offset+=4;

        let nameBytes = new Uint8Array(buffer, offset, 32);
        let name = new TextDecoder().decode(nameBytes).replace(/\0/g,"");
        offset+=32;

        let origSize = dv.getUint32(offset, true); offset+=4;

        files.push({start,size,name,origSize});
    }

    log("Index leído");

    // ===== EXTRAER =====
    for(let i=0;i<files.length;i++){

        let f = files[i];

        if(f.size <= 0) continue;

        let data = new Uint8Array(buffer.slice(f.start, f.start + f.size));

        // XOR
        for(let j=0;j<data.length;j++){
            data[j] ^= key[j % key.length];
        }

        try {
            let decompressed = pako.inflate(data);

            let blob = new Blob([decompressed], {type:"image/png"});
            let url = URL.createObjectURL(blob);

            let img = document.createElement("img");
            img.src = url;
            img.style.width = "120px";
            img.title = f.name || ("img_"+i);

            document.getElementById("imgs").appendChild(img);

        } catch(err){
            log("Error en archivo " + i);
        }

        if(i % 50 === 0) await new Promise(r=>setTimeout(r,1));
    }

    log("FIN");
};
</script>

</body>
</html>
