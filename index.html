<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Amnerys - Suite AO</title>

<style>
body { font-family: Consolas; background:#0a0a0a; color:#0f0; margin:0; }
.view{ display:none; padding:20px; height:100vh; }
.active{ display:block; }
.header{ display:flex; gap:10px; margin-bottom:10px; }
button{ padding:8px 15px; cursor:pointer; }
#mapDebug{ background:#000; padding:10px; height:85%; overflow:auto; white-space:pre; }
textarea{ width:100%; height:85%; background:#000; color:#0f0; }
</style>
</head>

<body>

<div id="main" class="view active">
    <button onclick="show('map')">MAP / INF / DAT</button>
    <button onclick="show('ind')">IND</button>
</div>

<div id="map" class="view">
    <div class="header">
        <button onclick="show('main')">←</button>
        <button onclick="mapInput.click()">MAP</button>
        <button onclick="infInput.click()">INF</button>
        <button onclick="datInput.click()">DAT</button>
        <input type="file" id="mapInput" hidden>
        <input type="file" id="infInput" hidden>
        <input type="file" id="datInput" hidden>
    </div>
    <div id="mapDebug"></div>
</div>

<div id="ind" class="view">
    <div class="header">
        <button onclick="show('main')">←</button>
        <button onclick="loadInd.click()">Cargar IND</button>
        <button onclick="saveIni()">Exportar INI</button>
        <input type="file" id="loadInd" hidden>
    </div>
    <textarea id="editor"></textarea>
</div>

<script>
function show(v){
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    document.getElementById(v).classList.add('active');
}

//////////////////////////////////////////////////
// MAP
//////////////////////////////////////////////////
mapInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);

    let out = "MAP\n\n";

    let offset = 272;
    let count = 0;

    for(let y=0;y<100;y++){
        for(let x=0;x<100;x++){

            if(offset+3>buf.byteLength) break;

            let block = view.getUint8(offset);
            let grh = view.getUint16(offset+1,true);

            if(count<500)
                out += `${x},${y} | ${block} | ${grh}\n`;

            offset+=3;
            count++;
        }
    }

    out += "\nTotal tiles: "+count;
    mapDebug.innerText = out;
};

//////////////////////////////////////////////////
// INF (ARREGLADO REAL)
//////////////////////////////////////////////////
infInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);

    let out = "INF DECODIFICADO\n\n";

    let offset = 0;
    let count = 0;

    while(offset < buf.byteLength-6){

        if(view.getUint8(offset)==1 && view.getUint8(offset+1)==2){

            // FIX REAL
            const tipo = view.getUint8(offset+3);
            const id   = view.getUint8(offset+5);

            out += `Bloque ${count}\n`;
            out += `Offset: 0x${offset.toString(16)}\n`;
            out += `Tipo: ${tipo} | ID: ${id}\n`;

            let data = [];
            let hasData = false;

            for(let i=0;i<16;i++){
                if(offset+6+i>=buf.byteLength) break;
                let b = view.getUint8(offset+6+i);
                if(b!==0) hasData = true;
                data.push(b.toString(16).padStart(2,'0'));
            }

            if(hasData){
                out += `DATA REAL: ${data.join(" ")}\n`;
            }

            out += "\n";

            count++;
            offset+=6;
        }else{
            offset++;
        }
    }

    out += `TOTAL BLOQUES: ${count}`;
    mapDebug.innerText = out;
};

//////////////////////////////////////////////////
// DAT (ARREGLADO → TEXTO REAL)
//////////////////////////////////////////////////
datInput.onchange = async e=>{
    const file = e.target.files[0];
    const buf = await file.arrayBuffer();

    // convertir a texto
    let text = new TextDecoder("latin1").decode(buf);

    let out = "DAT (INI DETECTADO)\n\n";

    // limpiar caracteres raros
    let lines = text.split(/\r?\n/);

    for(let line of lines){
        if(line.trim() !== "")
            out += line + "\n";
    }

    mapDebug.innerText = out;
};

//////////////////////////////////////////////////
// IND (NO TOCADO)
//////////////////////////////////////////////////
loadInd.onchange = async e=>{
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    let offset=0;
    const ver=view.getInt32(offset,true); offset+=4;
    const total=view.getInt32(offset,true); offset+=4;

    let text=`[INIT]\nNumGrh=${total}\nVersion=${ver}\n\n[Graphics]\n`;

    while(offset<buffer.byteLength){
        const index=view.getInt32(offset,true); offset+=4;
        if(index<=0) break;

        const frames=view.getInt16(offset,true); offset+=2;

        if(frames===1){
            const f=view.getInt32(offset,true); offset+=4;
            const x=view.getInt16(offset,true); offset+=2;
            const y=view.getInt16(offset,true); offset+=2;
            const w=view.getInt16(offset,true); offset+=2;
            const h=view.getInt16(offset,true); offset+=2;

            text+=`Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
        }else{
            let ids=[];
            for(let i=0;i<frames;i++){
                ids.push(view.getInt32(offset,true));
                offset+=4;
            }
            const spd=view.getFloat32(offset,true); offset+=4;
            text+=`Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
        }
    }

    editor.value=text;
};

function saveIni(){
    const blob=new Blob([editor.value],{type:"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Graficos.ini";
    a.click();
}
</script>

</body>
</html>
