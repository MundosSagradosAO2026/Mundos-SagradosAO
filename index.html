<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundos Sagrados - Argentum Online</title>

    <link rel="shortcut icon" href="MundosSagrados.ico" type="image/x-icon">
    <link rel="icon" href="MundosSagrados.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #000;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* FUEGO - Capa intermedia */
        #fireCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5; /* Por encima del fondo, por debajo del footer interactivo */
        }

        header {
            position: relative;
            z-index: 10;
            padding: 30px 40px;
        }

        #logoImg {
            max-width: 180px;
            float: left;
        }

        .main-content {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-title {
            text-align: center;
            font-size: 60px;
            font-weight: 900;
            color: #FFD700; 
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), -1px -1px 0 #000, 1px -1px 0 #000;
        }

        .beta-text {
            text-align: center;
            font-size: 26px;
            color: #fff;
            margin-top: 20px;
            text-shadow: 2px 2px 4px #000;
        }

        /* CONTROLES MÚSICA */
        .music-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255,140,0,0.5);
            border: 1px solid #FFD700;
        }

        .music-btn {
            font-size: 22px;
            background: none;
            border: none;
            color: #FFD700;
            cursor: pointer;
        }

        .volume-slider {
            width: 100px;
            accent-color: #FFD700;
        }

        /* FOOTER CON LÍNEA DORADA Y FUEGO ARRIBA */
        footer {
            position: relative;
            z-index: 20; /* El footer queda arriba de todo */
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to top, rgba(0,0,0,1) 80%, rgba(0,0,0,0));
            color: #FFD700; 
            font-weight: bold;
            font-size: 14px;
            border-top: 2px solid #FFD700; /* La línea dorada al final */
            box-shadow: 0 -10px 20px rgba(255, 140, 0, 0.3);
            letter-spacing: 1px;
        }

    </style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<div class="music-controls">
    <button id="musicToggle" class="music-btn">🔊</button><br>
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<header>
    <img id="logoImg" src="logo.png" alt="Mundos Sagrados">
</header>

<div class="main-content">
    <div class="main-title">Mundos Sagrados AO</div>
    <div class="beta-text" id="countdown"></div>
</div>

<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<audio id="bgMusic" loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== MUSICA ===== */
const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");
const volumeSlider = document.getElementById("volumeControl");
let isPlaying = false;

window.addEventListener("load", () => {
    music.volume = 0.5;
    document.addEventListener("click", () => {
        if (!isPlaying) {
            music.play().catch(() => {});
            isPlaying = true;
        }
    }, { once: true });
});

toggleBtn.addEventListener("click", () => {
    if(isPlaying){
        music.pause();
        toggleBtn.textContent = "🔇";
    } else {
        music.play();
        toggleBtn.textContent = "🔊";
    }
    isPlaying = !isPlaying;
});

volumeSlider.addEventListener("input", () => {
    music.volume = volumeSlider.value;
});

/* ===== CONTADOR FECHA FIJA (Marzo 1, 2028) ===== */
document.addEventListener("DOMContentLoaded", function() {
    const countdown = document.getElementById("countdown");
    const targetDate = new Date(2028, 2, 1, 0, 0, 0).getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
            countdown.innerHTML = "¡LA BETA HA COMENZADO!";
            return;
        }

        const msPerSecond = 1000;
        const msPerMinute = 60000;
        const msPerHour = 3600000;
        const msPerDay = 86400000;
        const msPerYear = 31536000000;

        const years = Math.floor(diff / msPerYear);
        const days = Math.floor((diff % msPerYear) / msPerDay);
        const hours = Math.floor((diff % msPerDay) / msPerHour);
        const minutes = Math.floor((diff % msPerHour) / msPerMinute);
        const seconds = Math.floor((diff % msPerMinute) / msPerSecond);

        countdown.innerHTML = "Versión beta en " + 
            (years > 0 ? years + " año(s), " : "") + 
            days + " días, " + hours + ":" + 
            (minutes < 10 ? "0" : "") + minutes + ":" + 
            (seconds < 10 ? "0" : "") + seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
});

/* ===== FUEGO MEJORADO (Desde la línea del footer) ===== */
const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let sparks = [];
class Spark {
    constructor() {
        this.x = Math.random() * canvas.width;
        // Salen desde la altura del footer
        this.y = canvas.height - 20; 
        this.size = Math.random() * 4 + 1;
        this.speedY = Math.random() * 3 + 1;
        this.speedX = Math.random() * 2 - 1;
        this.opacity = 1;
        this.color = Math.random() > 0.5 ? '#FFD700' : '#FF4500';
    }
    update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.opacity -= 0.008;
    }
    draw() {
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        // Brillo extra
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
    }
}

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.shadowBlur = 0; // Reset para rendimiento

    if (sparks.length < 100) {
        sparks.push(new Spark());
    }

    sparks.forEach((spark, index) => {
        spark.update();
        spark.draw();
        if (spark.opacity <= 0) {
            sparks.splice(index, 1);
        }
    });
}
animate();
</script>

</body>
</html>
