<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundos Sagrados - Argentum Online</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('mapa_ao.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #fireCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5; 
        }

        /* --- HEADER --- */
        header {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        #logoHeader { width: 50px; height: 50px; object-fit: contain; }
        .header-title { color: #FFD700; font-size: 20px; font-weight: 700; }

        nav ul { list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; }
        nav ul li a { text-decoration: none; color: #fff; font-size: 16px; font-weight: 700; transition: 0.3s; cursor: pointer; }
        nav ul li a:hover { color: #FFD700; text-shadow: 0 0 15px #FFD700; }

        /* --- MENÚ DESPLEGABLE IZQUIERDA (AUDIO) --- */
        .side-menu {
            position: fixed;
            top: 180px;
            left: -222px; /* Totalmente oculto */
            width: 220px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #FFD700;
            border-left: none;
            border-radius: 0 10px 10px 0;
            padding: 20px;
            z-index: 1000;
            transition: 0.4s ease-in-out;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .side-menu.open {
            left: 0;
        }

        .side-menu-handle {
            position: absolute;
            right: -25px; /* Solo asoma un poquito */
            top: 0;
            width: 25px;
            height: 50px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #FFD700;
            border-left: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
            font-size: 12px;
        }

        .side-menu span { color: #FFD700; font-size: 13px; font-weight: bold; display: block; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px; }

        .btn-audio {
            width: 100%;
            background: #FFD700;
            color: #000;
            border: none;
            padding: 10px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            margin-bottom: 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-audio:hover { background: #fff; transform: scale(1.02); }

        .vol-info { display: flex; justify-content: space-between; color: #fff; font-size: 10px; margin-top: 10px; }
        .volume-slider { width: 100%; accent-color: #FFD700; cursor: pointer; margin-top: 5px; }

        /* --- CONTENIDO CENTRAL --- */
        .main-content {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #logoCentral { width: 280px; height: 280px; object-fit: contain; margin-bottom: 20px; }
        .main-title-big { font-size: 65px; color: #FFD700; margin: 10px 0; text-shadow: 2px 2px 10px #000; }
        .beta-text { font-size: 22px; color: #fff; background: rgba(0,0,0,0.7); padding: 12px 35px; border-radius: 50px; border: 1px solid #FFD700; }

        /* --- NPC --- */
        #npc-container {
            position: fixed;
            bottom: 180px;
            left: -100px;
            width: 64px;
            height: 64px;
            z-index: 8;
            animation: walk-across 22s linear infinite;
        }
        #npc { width: 64px; height: 64px; background: url('npc_sprite.png') no-repeat; animation: sprite-animation 0.8s steps(4) infinite; }
        @keyframes walk-across { 0% { left: -100px; transform: scaleX(1); } 48% { transform: scaleX(1); } 50% { left: 110%; transform: scaleX(-1); } 98% { transform: scaleX(-1); } 100% { left: -100px; transform: scaleX(1); } }
        @keyframes sprite-animation { from { background-position: 0px; } to { background-position: -256px; } }

        /* --- FOOTER --- */
        footer {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 45px 20px;
            background: #000;
            color: #FFD700; 
            font-weight: bold;
            border-top: 1px solid rgba(255, 215, 0, 0.4);
        }
    </style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<div class="side-menu" id="sideMenu">
    <div class="side-menu-handle" id="menuHandle">
        <span id="arrow">▶</span>
    </div>
    <span>AMBIENTACIÓN</span>
    <button class="btn-audio" id="playBtn">ACTIVAR MÚSICA</button>
    <button class="btn-audio" id="stopBtn" style="background: #333; color: #fff;">SILENCIAR</button>
    
    <div class="vol-info">
        <label>VOLUMEN</label>
        <label id="volLabel">50%</label>
    </div>
    <input type="range" id="volControl" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<header>
    <div class="header-left">
        <img id="logoHeader" src="logo.png" alt="Mundos Sagrados">
        <span class="header-title">Mundos Sagrados AO</span>
    </div>
    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Trailer</a></li>
            <li><a href="#">Galería</a></li>
            <li><a href="#">Discord</a></li>
            <li><a href="#">Wiki</a></li>
        </ul>
    </nav>
</header>

<div id="npc-container">
    <div id="npc"></div>
</div>

<div class="main-content">
    <img id="logoCentral" src="logo.png" alt="Logo Central">
    <h1 class="main-title-big">MUNDOS SAGRADOS</h1>
    <div class="beta-text" id="countdown"></div>
</div>

<footer>
    © Mundos Sagrados Argentum Online — Todos los derechos reservados
</footer>

<audio id="bgMusic" loop>
    <source src="principal.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== LÓGICA DE MÚSICA Y MENÚ ===== */
const music = document.getElementById("bgMusic");
const playBtn = document.getElementById("playBtn");
const stopBtn = document.getElementById("stopBtn");
const volControl = document.getElementById("volControl");
const volLabel = document.getElementById("volLabel");
const sideMenu = document.getElementById("sideMenu");
const menuHandle = document.getElementById("menuHandle");
const arrow = document.getElementById("arrow");

let closeTimer;
let started = false;

music.volume = 0.5;

// REPRODUCCIÓN AL HACER CLICK EN CUALQUIER LADO
document.addEventListener('click', () => {
    if(!started) {
        music.play().catch(() => {});
        started = true;
    }
});

function closeMenu() {
    sideMenu.classList.remove("open");
    arrow.innerText = "▶";
}

function resetTimer() {
    clearTimeout(closeTimer);
    if (sideMenu.classList.contains("open")) {
        closeTimer = setTimeout(closeMenu, 5000);
    }
}

menuHandle.addEventListener("click", (e) => {
    e.stopPropagation();
    sideMenu.classList.toggle("open");
    if (sideMenu.classList.contains("open")) {
        arrow.innerText = "◀";
        resetTimer();
    } else {
        arrow.innerText = "▶";
    }
});

sideMenu.addEventListener("mouseenter", () => clearTimeout(closeTimer));
sideMenu.addEventListener("mouseleave", resetTimer);

playBtn.addEventListener("click", () => { music.play(); resetTimer(); });
stopBtn.addEventListener("click", () => { music.pause(); resetTimer(); });

volControl.addEventListener("input", () => {
    music.volume = volControl.value;
    volLabel.innerText = Math.round(volControl.value * 100) + "%";
    resetTimer();
});

/* ===== CONTADOR 2 AÑOS ===== */
function updateCountdown() {
    const countdown = document.getElementById("countdown");
    const targetDate = new Date(2028, 2, 1, 0, 0, 0).getTime();
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) { countdown.innerHTML = "¡LA BETA HA COMENZADO!"; return; }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    countdown.innerHTML = `Versión beta en ${days}d ${hours}h ${minutes}m ${seconds}s`;
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* ===== FUEGO DEL FOOTER ===== */
const canvas = document.getElementById("fireCanvas");
const ctx = canvas.getContext("2d");
let footerElement = document.querySelector('footer');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let sparks = [];
class Spark {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = footerElement.getBoundingClientRect().top; 
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * 1.2 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.opacity = 1;
        this.maxLife = Math.random() * 100 + 50;
        this.life = 0;
    }
    update() { this.y -= this.speedY; this.x += this.speedX; this.life++; this.opacity = 1 - (this.life / this.maxLife); }
    draw() {
        ctx.fillStyle = `rgba(255, ${160 + Math.random() * 40}, 0, ${this.opacity})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    }
}

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (sparks.length < 35) sparks.push(new Spark());
    sparks.forEach((spark, index) => {
        spark.update(); spark.draw();
        if (spark.opacity <= 0) sparks.splice(index, 1);
    });
}
animate();
</script>

</body>
</html>
