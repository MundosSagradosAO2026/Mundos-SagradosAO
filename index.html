<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys Suite - Editor & Unpacker Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #mainMenu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .logo-title { font-size: 2.5em; text-shadow: 0 0 15px #00ff00; color: #fff; }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 80%; max-width: 600px; }
        .card { background: #1e1e1e; border: 2px solid #333; padding: 20px; border-radius: 12px; cursor: pointer; text-align: center; }
        .card:hover { border-color: #00adb5; background: #252525; }
        .view-container { display: none; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        #editor { flex: 1; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; resize: none; outline: none; }
        .unpacker-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .side-panel { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .gallery { background: #000; border-radius: 8px; border: 1px solid #333; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .img-card { background: #111; border: 1px solid #444; padding: 5px; text-align: center; font-size: 9px; color: #eee; }
        .img-card img { max-width: 100%; height: auto; image-rendering: pixelated; background: #222; }
        .btn { padding: 8px 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 4px; background: #00adb5; color: white; }
        .btn-save { background: #28a745; }
        .btn-back { background: #ff4d4d; }
        #logUnpack { background:#000; padding:10px; font-size:11px; height:150px; overflow-y:auto; border:1px solid #333; color:#0f0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="logo-title">AMNERYS SUITE</div>
        <div class="grid-buttons">
            <div class="card" onclick="showView('editorContainer')"><h3>Editor .IND</h3></div>
            <div class="card" onclick="showView('unpackerContainer')"><h3>Unpacker .TSAO</h3></div>
        </div>
    </div>

    <div id="editorContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">Volver</button>
            <input type="file" id="loadInd" style="display:none">
            <button class="btn" onclick="document.getElementById('loadInd').click()">Abrir .IND</button>
            <button class="btn btn-save" onclick="saveInd()">Guardar .IND</button>
            <button class="btn" style="background:#666" onclick="saveIni()">Descargar .INI</button>
            <div id="statusInd" style="margin-left:auto">Listo</div>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="Carga un archivo .ind..."></textarea>
    </div>

    <div id="unpackerContainer" class="view-container">
        <div class="header">
            <button class="btn btn-back" onclick="showView('mainMenu')">Volver</button>
            <strong>Extracción Grh.tsao (Estructura de 48 bytes)</strong>
        </div>
        <div class="unpacker-layout">
            <div class="side-panel">
                <label>Cargar Grh.tsao:</label>
                <input type="file" id="fileData">
                <button class="btn" id="btnRunUnpack">EXTRAER IMÁGENES</button>
                <div id="logUnpack">Esperando archivo...</div>
            </div>
            <div class="gallery" id="galleryBox"></div>
        </div>
    </div>

<script>
    let currentVersion = 0;

    function showView(id) {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('editorContainer').style.display = 'none';
        document.getElementById('unpackerContainer').style.display = 'none';
        if(id === 'mainMenu') document.getElementById('mainMenu').classList.remove('hidden');
        else document.getElementById(id).style.display = 'flex';
    }

    // --- LÓGICA EDITOR .IND (IDÉNTICA A LA TUYA) ---
    const editorArea = document.getElementById('editor');
    document.getElementById('loadInd').onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        let offset = 0;
        currentVersion = view.getInt32(offset, true); offset += 4;
        const total = view.getInt32(offset, true); offset += 4;
        let text = `[INIT]\nNumGrh=${total}\nVersion=${currentVersion}\n\n[Graphics]\n`;
        while (offset < buffer.byteLength) {
            if (offset + 4 > buffer.byteLength) break;
            const index = view.getInt32(offset, true); offset += 4;
            if (index <= 0) break;
            const frames = view.getInt16(offset, true); offset += 2;
            if (frames === 1) {
                const f = view.getInt32(offset, true); offset += 4;
                const x = view.getInt16(offset, true); offset += 2;
                const y = view.getInt16(offset, true); offset += 2;
                const w = view.getInt16(offset, true); offset += 2;
                const h = view.getInt16(offset, true); offset += 2;
                text += `Grh${index}=1-${f}-${x}-${y}-${w}-${h}\n`;
            } else {
                let ids = [];
                for(let i=0; i<frames; i++) { ids.push(view.getInt32(offset, true)); offset += 4; }
                const spd = view.getFloat32(offset, true).toFixed(3).replace(/\.?0+$/, ""); offset += 4;
                text += `Grh${index}=${frames}-${ids.join('-')}-${spd}\n`;
            }
        }
        editorArea.value = text;
        document.getElementById('statusInd').innerText = `Grhs: ${total}`;
    };

    function saveInd() {
        const lines = editorArea.value.split('\n');
        let grhs = [];
        let totalGrh = 0;
        lines.forEach(line => {
            if (line.startsWith('NumGrh=')) totalGrh = parseInt(line.split('=')[1]);
            if (line.startsWith('Grh')) {
                const parts = line.split('=');
                const idx = parseInt(parts[0].replace('Grh', ''));
                const data = parts[1].split('-');
                grhs.push({ idx, data });
            }
        });
        const buffer = new ArrayBuffer(grhs.length * 80 + 100);
        const view = new DataView(buffer);
        let offset = 0;
        view.setInt32(offset, currentVersion, true); offset += 4;
        view.setInt32(offset, totalGrh || grhs.length, true); offset += 4;
        grhs.forEach(g => {
            view.setInt32(offset, g.idx, true); offset += 4;
            const frames = parseInt(g.data[0]);
            view.setInt16(offset, frames, true); offset += 2;
            if (frames === 1) {
                view.setInt32(offset, parseInt(g.data[1]), true); offset += 4;
                view.setInt16(offset, parseInt(g.data[2]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[3]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[4]), true); offset += 2;
                view.setInt16(offset, parseInt(g.data[5]), true); offset += 2;
            } else {
                for(let i=1; i<=frames; i++) { view.setInt32(offset, parseInt(g.data[i]), true); offset += 4; }
                view.setFloat32(offset, parseFloat(g.data[frames+1]), true); offset += 4;
            }
        });
        downloadBlob(buffer.slice(0, offset), "Graficos.ind");
    }

    function saveIni() { downloadBlob(editorArea.value, "Graficos.ini"); }
    function downloadBlob(content, name) {
        const blob = new Blob([content], { type: "application/octet-stream" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    }

    // --- LÓGICA UNPACKER (SEGÚN TU ANÁLISIS) ---
    document.getElementById('btnRunUnpack').onclick = async () => {
        const dFile = document.getElementById('fileData').files[0];
        if (!dFile) return alert("Carga Grh.tsao");
        const log = document.getElementById('logUnpack');
        const gall = document.getElementById('galleryBox');
        gall.innerHTML = ""; log.innerHTML = "Analizando Grh.tsao...<br>";

        const dBuf = await dFile.arrayBuffer();
        const dView = new DataView(dBuf);
        const dBytes = new Uint8Array(dBuf);

        // PasswordPak constante mágica de tu análisis
        const PasswordPak = 435098;
        const ofuscatedSize = dView.getInt32(0, true);
        const realSize = ofuscatedSize - PasswordPak;
        const numFiles = dView.getInt16(4, true);

        log.innerHTML += `Archivos: ${numFiles}<br>Tamaño Real: ${realSize}<br>`;

        let offset = 6; // Saltar FILEHEADER (6 bytes)
        const infoHeaderSize = 48; // Según tu análisis

        for (let i = 0; i < numFiles; i++) {
            if (offset + infoHeaderSize > dBuf.byteLength) break;

            // Según tu INFOHEADER:
            // [0-3] lngFileStart (Long)
            // [4-7] lngFileSize (Long)
            // [8-39] strFileName (String*32)
            // [40-43] lngFileSizeUncompressed (Long)
            
            const startPos = dView.getUint32(offset, true);
            const size = dView.getUint32(offset + 4, true);
            let nameBytes = new Uint8Array(dBuf, offset + 8, 32);
            let fName = new TextDecoder().decode(nameBytes).replace(/\0/g, '').trim();
            
            offset += infoHeaderSize;

            if (size > 0 && startPos + size <= dBytes.length) {
                try {
                    let chunk = dBytes.slice(startPos, startPos + size);
                    // Descomprimir con Zlib (Pako)
                    const unzipped = pako.inflate(chunk);
                    const url = URL.createObjectURL(new Blob([unzipped], {type:'image/png'}));
                    
                    const div = document.createElement('div');
                    div.className = 'img-card';
                    div.innerHTML = `<img src="${url}"><br>${fName}`;
                    gall.appendChild(div);
                } catch (e) {
                    // console.log("Error descomprimiendo " + fName);
                }
            }
            if (i % 50 === 0) {
                log.innerHTML = `Extrayendo: ${i} / ${numFiles}...`;
                await new Promise(r => setTimeout(r, 1));
            }
        }
        log.innerHTML = "<strong>Finalizado.</strong>";
    };
</script>
</body>
</html>
