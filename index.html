<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor Graficos.ind PRO</title>

<style>
body{
    background:#0b0b0b;
    color:#FFD700;
    font-family: monospace;
    text-align:center;
    padding:40px;
}
.box{
    border:1px solid #FFD700;
    padding:20px;
    max-width:800px;
    margin:auto;
    background:#111;
}
button{
    background:#FFD700;
    border:none;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
    font-weight:bold;
}
pre{
    text-align:left;
    background:#000;
    padding:10px;
    height:300px;
    overflow:auto;
    color:#0f0;
}
.progress{
    width:100%;
    background:#222;
    height:20px;
    margin-top:15px;
    border:1px solid #FFD700;
}
.bar{
    height:100%;
    width:0%;
    background:#FFD700;
}
</style>
</head>

<body>

<div class="box">
    <h2>📦 Lector Graficos.ind PRO</h2>

    <input type="file" id="fileInput"><br>

    <button onclick="procesar()">Leer Archivo</button>
    <button onclick="descargar()">Descargar .ini</button>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <p id="info"></p>

    <pre id="output"></pre>
</div>

<script>
let iniTexto = "";

function readLong(view, offset){
    return view.getInt32(offset, true);
}

function readFloat(view, offset){
    return view.getFloat32(offset, true);
}

async function procesar(){
    const file = document.getElementById("fileInput").files[0];
    if(!file){
        alert("Subí un archivo primero");
        return;
    }

    const reader = new FileReader();

    reader.onload = async function(e){

        try{

            const buffer = e.target.result;
            const view = new DataView(buffer);

            let offset = 0;

            let version = readLong(view, offset); offset+=4;
            let grhCount = readLong(view, offset); offset+=4;

            let ini = "[INIT]\n";
            ini += "NumGrh=" + grhCount + "\n";
            ini += "Version=" + version + "\n\n";

            let leidos = 0;
            let totalBytes = view.byteLength;

            while(true){

                if(offset >= totalBytes) break;

                let grhIndex = readLong(view, offset); offset+=4;

                if(grhIndex === 0) break;

                let NumFrames = readLong(view, offset); offset+=4;

                if(NumFrames <= 0 || NumFrames > 5000){
                    console.log("Corte por dato inválido en:", grhIndex);
                    break;
                }

                if(NumFrames === 1){

                    let FileNum = readLong(view, offset); offset+=4;
                    let sX = readLong(view, offset); offset+=4;
                    let sY = readLong(view, offset); offset+=4;
                    let w = readLong(view, offset); offset+=4;
                    let h = readLong(view, offset); offset+=4;

                    ini += `Grh${grhIndex}=${NumFrames}-${FileNum}-${sX}-${sY}-${w}-${h}\n`;

                }else{

                    let frames = [];

                    for(let i=0;i<NumFrames;i++){
                        frames.push(readLong(view, offset));
                        offset+=4;
                    }

                    let speed = readFloat(view, offset); offset+=4;
                    speed = Math.round(speed);

                    ini += `Grh${grhIndex}=${NumFrames}-${frames.join("-")}-${speed}\n`;
                }

                leidos++;

                // 🔥 Actualiza barra cada 200 gráficos
                if(leidos % 200 === 0){
                    let progress = (offset / totalBytes) * 100;
                    document.getElementById("bar").style.width = progress + "%";
                    await new Promise(r => setTimeout(r, 1)); // libera UI
                }
            }

            iniTexto = ini;

            document.getElementById("bar").style.width = "100%";

            document.getElementById("info").innerText =
                "✔ Version: " + version +
                " | Declarados: " + grhCount +
                " | Leídos: " + leidos;

            document.getElementById("output").innerText =
                ini.substring(0, 3000) || "⚠ No se pudo leer contenido";

        }catch(err){
            console.error(err);
            document.getElementById("output").innerText =
                "❌ ERROR: " + err.message;
        }
    };

    reader.readAsArrayBuffer(file);
}

function descargar(){
    if(!iniTexto){
        alert("Primero leé el archivo");
        return;
    }

    const blob = new Blob([iniTexto], {type:"text/plain"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Graficos.ini";
    a.click();
}
</script>

</body>
</html>
