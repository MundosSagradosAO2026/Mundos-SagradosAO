<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amnerys Suite - Fix Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Consolas', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 20px; }
        .view-container { display: flex; flex-direction: column; height: 90vh; }
        .header { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .unpacker-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .side-panel { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .gallery { background: #000; border-radius: 8px; border: 1px solid #333; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .img-card { background: #111; border: 1px solid #444; padding: 5px; text-align: center; font-size: 10px; color: #eee; border-radius: 4px; }
        .img-card img { max-width: 100px; height: auto; image-rendering: pixelated; background: #222; }
        .btn { padding: 10px 20px; cursor: pointer; font-weight: bold; border: none; border-radius: 4px; background: #00adb5; color: white; }
        #logUnpack { background:#000; padding:10px; font-size:11px; height:150px; overflow-y:auto; border:1px solid #333; color:#0f0; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="view-container">
        <div class="header">
            <strong>Amnerys Unpacker - Versión de Recuperación</strong>
        </div>
        
        <div class="unpacker-layout">
            <div class="side-panel">
                <label>1. Grh_path.tsao:</label>
                <input type="file" id="filePaths">
                <label>2. Grh.tsao:</label>
                <input type="file" id="fileData">
                <button class="btn" id="btnRunUnpack">EXTRAER GRÁFICOS</button>
                <div id="logUnpack">Esperando archivos...</div>
            </div>
            
            <div class="gallery" id="galleryBox">
                </div>
        </div>
    </div>

<script>
    document.getElementById('btnRunUnpack').onclick = async () => {
        const pFile = document.getElementById('filePaths').files[0];
        const dFile = document.getElementById('fileData').files[0];
        const log = document.getElementById('logUnpack');
        const gall = document.getElementById('galleryBox');

        if (!pFile || !dFile) return alert("Carga ambos archivos .tsao");

        log.innerHTML = "Iniciando extracción técnica...<br>";
        gall.innerHTML = "";
        
        const pBuf = await pFile.arrayBuffer();
        const dBuf = await dFile.arrayBuffer();
        const pView = new DataView(pBuf);
        const dBytes = new Uint8Array(dBuf);
        
        // 1. Detectar número de archivos (bloques de 44 bytes)
        // Según tus archivos, los primeros 4 bytes son el tamaño total ofuscado.
        const numFiles = Math.floor((pBuf.byteLength - 4) / 44);
        log.innerHTML += `Archivos detectados: ${numFiles}<br>`;

        // 2. Clave XOR (Solo si el Zlib falla directamente)
        const key = "quierovalecuatro";
        const datCM = key.split('').map(c => c.charCodeAt(0));

        // Empezamos en el byte 4 (después del header de tamaño)
        let offset = 4;

        for (let i = 0; i < numFiles; i++) {
            // Estructura REAL de tus archivos:
            // [0-31] -> Nombre del archivo (ej: "1.png")
            // [32-35] -> Posición de inicio en Grh.tsao
            // [36-39] -> Tamaño comprimido
            // [40-43] -> Tamaño descomprimido (opcional)

            let nameBytes = new Uint8Array(pBuf, offset, 32);
            let fName = new TextDecoder().decode(nameBytes).replace(/\0/g, '').trim();
            
            const startPos = pView.getUint32(offset + 32, true);
            const size = pView.getUint32(offset + 36, true);

            if (size > 0 && size < 5000000 && (startPos + size) <= dBytes.length) {
                try {
                    let chunk = dBytes.slice(startPos, startPos + size);
                    
                    // Probamos descompresión directa (Zlib)
                    let unzipped;
                    try {
                        unzipped = pako.inflate(chunk);
                    } catch(e) {
                        // Si falla, aplicamos el XOR y reintentamos
                        for (let j = 0; j < chunk.length; j++) {
                            chunk[j] = chunk[j] ^ datCM[j % datCM.length];
                        }
                        unzipped = pako.inflate(chunk);
                    }

                    const url = URL.createObjectURL(new Blob([unzipped], {type:'image/png'}));

                    const div = document.createElement('div');
                    div.className = 'img-card';
                    div.innerHTML = `<img src="${url}"><br>${fName}`;
                    gall.appendChild(div);

                } catch (err) {
                    // console.log("Error en:", fName);
                }
            }

            offset += 44;

            // Refrescar interfaz cada 100 archivos para que no se congele
            if (i % 100 === 0) {
                log.innerHTML = `Procesando: ${i} / ${numFiles}...`;
                await new Promise(r => setTimeout(r, 1));
            }
        }
        log.innerHTML = "<strong>¡Extracción Completa!</strong>";
    };
</script>
</body>
</html>
